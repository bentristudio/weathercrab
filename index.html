<style>
/* layout: one phone-width column that flows top to bottom — header, crab on a glow, the temperature, hours, a sentence, buttons.
   single dark theme on purpose: the weather glows behind the crab. on a computer the app sits inside a phone on a soft blue-gray page. */
:root {
  color-scheme: dark;
  --bg: #1b1918;
  --ink: #efe9e1;
  --muted: #a8a097;
  --faint: #6f6861;
  --chip: #2c2927;
  --chip-hover: #37332f;
  --sheet: #232120;
  --line: #3a3633;
  --scrim: rgba(0, 0, 0, .5);
  --wall-a: #4d5b45;
  --wall-b: #39442f;
  --widget: #262321;
  --focus: #8fb3d9;
  --glow-o: .55;
  --ease-out: cubic-bezier(.22, 1, .36, 1);
  --spring: cubic-bezier(.34, 1.4, .64, 1);
  --font: "Comic Neue", "Comic Sans MS", "Chalkboard SE", "Comic Sans", cursive;
  --desk: #b9c6d3;
  --rain: #8fc0ea;
}
[hidden] { display: none !important; }
@property --glow { syntax: "<color>"; inherits: true; initial-value: #cfe0ef; }

html, body { height: 100%; }
html { background: var(--bg); }
body {
  background: var(--bg);
  overscroll-behavior: none;
  text-rendering: optimizeLegibility;
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 10px; }

.frame { height: 100%; }
.chrome, .side { display: none; }
.app {
  position: relative;
  height: 100%;
  max-width: 430px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 6px 10px;
  display: flex;
  flex-direction: column;
  box-sizing: border-box;
  overflow: hidden;
}
@media (max-height: 430px) { .app { overflow-y: auto; } }

/* on a computer: the app lives in a phone, like the video */
@media (min-width: 720px) and (min-height: 640px) and (hover: hover) and (pointer: fine) {
  html, body { background: var(--desk); }
  body { display: grid; place-items: center; }
  .frame {
    position: relative; width: 390px; height: min(844px, calc(100% - 64px));
    border-radius: 56px; background: #0e0d0c;
    box-shadow: 0 0 0 9px #0e0d0c, 0 0 0 12px #d9744a, 0 0 0 13px #b35a38, 0 44px 90px -10px rgba(38, 50, 66, .5), 0 14px 30px rgba(38, 50, 66, .25);
  }
  .app { height: 100%; max-width: none; padding-top: 52px; border-radius: 52px; background: var(--bg); }
  .chrome { display: block; position: absolute; inset: 0 0 auto 0; height: 52px; z-index: 5; pointer-events: none; color: #f4f1ea; }
  .chrome .island { position: absolute; top: 11px; left: 50%; translate: -50% 0; width: 118px; height: 33px; border-radius: 20px; background: #000; }
  .chrome .time { position: absolute; top: 15px; left: 42px; font: 600 16px/24px -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; }
  .chrome .sig { position: absolute; top: 19px; right: 30px; width: 66px; height: 14px; }
  .side { display: block; position: absolute; width: 4px; border-radius: 2px; background: #c9673f; }
  .side.a { left: -15px; top: 150px; height: 28px; }
  .side.b { left: -15px; top: 200px; height: 54px; }
  .side.c { left: -15px; top: 266px; height: 54px; }
  .side.d { right: -15px; top: 220px; height: 86px; }
}

/* header */
.top { display: grid; grid-template-columns: 76px 1fr 76px; align-items: center; height: 46px; }
.round {
  width: 32px; height: 32px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--chip); color: var(--muted);
  font-size: 13px; font-weight: 700;
  transition: background-color .2s;
}
.round:hover { background: var(--chip-hover); }
.top-left { display: flex; align-items: center; gap: 6px; }
.install { position: relative; }
.install .crab-glyph { width: 20px; height: 14px; }
.install .badge {
  position: absolute; right: -3px; bottom: -3px;
  width: 14px; height: 14px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--ink); color: var(--bg);
  font-size: 12px; font-weight: 700; line-height: 1;
}
.install-app { display: flex; align-items: center; gap: 14px; padding: 4px 2px; }
.install-app .icon { width: 60px; height: 60px; flex: none; border-radius: 14px; background: var(--widget); display: grid; place-items: center; overflow: hidden; }
.install-app .icon svg { width: 86%; height: 86%; }
.install-app b { display: block; font-size: 16px; }
.install-app small { font-size: 13px; color: var(--muted); }
.steps { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; counter-reset: step; }
.steps li { counter-increment: step; display: flex; align-items: center; gap: 12px; font-size: 15px; line-height: 1.35; }
.steps li::before {
  content: counter(step); flex: none;
  width: 26px; height: 26px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--chip); color: var(--ink); font-weight: 700; font-size: 13px;
}
.steps .ic { display: inline-grid; place-items: center; vertical-align: -4px; width: 22px; height: 22px; border-radius: 6px; background: var(--chip); margin-inline: 2px; }
.steps .ic svg { width: 14px; height: 14px; }
.round svg { width: 15px; height: 15px; }
.units { position: relative; justify-self: end; display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--chip); }
.units::before { content: ""; position: absolute; top: 3px; bottom: 3px; left: 3px; width: 32px; border-radius: 999px; background: var(--ink); transition: transform .4s var(--ease-out); }
.units[data-unit="c"]::before { transform: translateX(34px); }
.units button { position: relative; z-index: 1; width: 32px; padding: 6px 0; text-align: center; font-size: 12px; font-weight: 700; line-height: 1; color: var(--muted); border-radius: 999px; }
.units button:hover { color: var(--ink); }
.units button[aria-pressed="true"] { color: var(--bg); }
.city {
  justify-self: center;
  display: inline-flex; flex-direction: column; align-items: center;
  font-weight: 700; font-size: 17px; color: var(--muted);
  padding: 4px 10px; border-radius: 12px;
  max-width: 100%; min-width: 0;
}
.city-row { display: inline-flex; align-items: center; gap: 5px; max-width: 100%; }
.place { font-size: 12px; font-weight: 400; line-height: 14px; color: var(--muted); max-width: 100%; }
.city span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.city .pin { width: 11px; height: 11px; flex: none; }
.city .chev { width: 11px; height: 11px; flex: none; }
.city:hover { color: var(--ink); }
.city[data-len="l"] { font-size: 15.5px; }
.city[data-len="xl"] { font-size: 14px; }
@media (max-width: 380px) { .city { padding-inline: 4px; } .place { font-size: 11px; } }
@media (max-width: 340px) { .top { grid-template-columns: 34px minmax(0, 1fr) 70px; } .top-left .install { display: none; } .city { font-size: 15px; } .city[data-len="l"] { font-size: 13.5px; } .city[data-len="xl"] { font-size: 12.5px; } .place { font-size: 10px; } .sub { font-size: 13.5px; padding-inline: 2px; } .sub i { padding-inline: 3px; } }

/* ---------- the column: every block takes its own space, so text can never land on other text ---------- */
.stage {
  position: relative; flex: 1 1 0; min-height: 96px; max-height: min(40vh, 330px); margin-block: auto;
  display: grid; place-items: center;
  touch-action: pan-y; user-select: none; -webkit-user-select: none;
}
.glow {
  position: absolute; left: 50%; top: 50%;
  width: min(100%, 350px); aspect-ratio: 1;
  translate: -50% -50%;
  border-radius: 50%;
  background: radial-gradient(closest-side, var(--glow) 0%, var(--glow) 26%, color-mix(in srgb, var(--glow) 58%, transparent) 54%, color-mix(in srgb, var(--glow) 20%, transparent) 78%, color-mix(in srgb, var(--glow) 0%, transparent) 100%);
  filter: blur(10px);
  transition: --glow .9s ease;
  animation: glowBreath 8s ease-in-out infinite;
  pointer-events: none;
}
@keyframes glowBreath { 0%, 100% { scale: 1; } 50% { scale: 1.05; } }
.fx {
  position: absolute; left: 50%; top: 50%;
  width: min(100%, 350px); aspect-ratio: 1;
  translate: -50% -50%;
  -webkit-mask-image: radial-gradient(closest-side, #000 45%, transparent 95%);
  mask-image: radial-gradient(closest-side, #000 45%, transparent 95%);
  pointer-events: none;
}
.cat-stack {
  position: relative; height: 82%; max-height: 232px; aspect-ratio: 240 / 200; max-width: 100%;
  transition: transform .5s var(--ease-out), opacity .3s ease;
  will-change: transform;
}
.cat-stack svg { width: 100%; height: 100%; display: block; overflow: visible; }
.swiping .cat-stack, .swiping .read { transition: none; }

/* crab idle motion */
.crab .eyes { transform-box: fill-box; transform-origin: center; animation: blink 5.5s infinite; }
.crab .breathe { transform-box: view-box; transform-origin: 120px 195px; animation: breathe 3.4s ease-in-out infinite; }
@keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.12); } }
@keyframes breathe { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.02); } }

/* how the crab moves depends on the weather (data-move on the svg) */
.crab .move, .crab .gust, .crab .bump, .crab .umb, .crab .leg, .crab .sweat, .crab .ground { transform-box: view-box; }
.crab .move, .crab .gust, .crab .bump { transform-origin: 120px 195px; }
.crab .umb { transform-origin: 214px 130px; }
.crab .ground { transform-origin: 120px 198px; }
.crab .sweat { opacity: 0; }
.crab[data-move="shiver"] .move { animation: shiver 2.6s linear infinite; }
.crab[data-move="brr"] .move { animation: brr 4.2s linear infinite; }
.crab[data-move="freeze"] .move { animation: freeze .8s linear infinite; }
.crab[data-move="sway"] .move { animation: sway 3.4s ease-in-out infinite alternate; }
.crab[data-move="scuttle"] .move { animation: scuttle 4.8s ease-in-out infinite; }
.crab[data-move="scuttle"] .ground { animation: scuttleGround 4.8s ease-in-out infinite; }
.crab[data-move="scuttle"] .leg { animation: step .32s ease-in-out infinite alternate; }
.crab[data-move="scuttle"] .l1, .crab[data-move="scuttle"] .l3 { animation-delay: -.16s; }
.crab[data-move="hop"] .move { animation: hop 1.9s ease-in-out infinite; }
.crab[data-move="hop"] .ground { animation: hopGround 1.9s ease-in-out infinite; }
.crab[data-move="bounce"] .move { animation: bounce 1.3s ease-in-out infinite; }
.crab[data-move="melt"] .move { animation: melt 2.8s ease-in-out infinite alternate; }
.crab[data-move="melt"] .sweat { animation: drip 2.8s ease-in infinite; }
.crab[data-move="rain"] .move { animation: bounce 2.4s ease-in-out infinite; }
.crab[data-move="rain"] .umb { animation: wobble 2.6s ease-in-out infinite alternate; }
.crab.windy .gust { animation: gust 3.2s ease-in-out infinite; }
.crab.windy .umb { animation: wobble-hard 1.1s ease-in-out infinite alternate; }
.crab .bump.land { animation: land .42s var(--ease-out); }
@keyframes land { 0% { transform: none; } 30% { transform: scale(1.035, .955); } 62% { transform: scale(.985, 1.018); } 100% { transform: none; } }
@keyframes shiver { 0%, 52%, 70%, 100% { transform: none; } 54%, 58% { transform: translateX(-1.8px); } 56%, 60% { transform: translateX(1.8px); } 62% { transform: translateX(-1.4px); } 64% { transform: translateX(1.4px); } 66% { transform: translateX(-1px); } 68% { transform: translateX(1px); } }
@keyframes brr { 0%, 76%, 86%, 100% { transform: none; } 78%, 82% { transform: translateX(-1.2px); } 80%, 84% { transform: translateX(1.2px); } }
@keyframes freeze { 0%, 100% { transform: translateX(0); } 10%, 30%, 70% { transform: translateX(-2.2px) rotate(-.4deg); } 20%, 40%, 80% { transform: translateX(2.2px) rotate(.4deg); } 50% { transform: translateX(-1.6px); } 60% { transform: translateX(1.6px); } 90% { transform: translateX(-1.2px); } }
@keyframes sway { from { transform: rotate(-2.5deg); } to { transform: rotate(2.5deg); } }
@keyframes scuttle { 0%, 100% { transform: translateX(-10px); } 50% { transform: translateX(10px); } }
@keyframes scuttleGround { 0%, 100% { transform: translateX(-10px); } 50% { transform: translateX(10px); } }
@keyframes step { from { transform: translateY(0); } to { transform: translateY(-3.5px); } }
@keyframes hop { 0%, 55%, 100% { transform: translateY(0) scale(1, 1); } 8% { transform: translateY(0) scale(1.04, .93); } 22% { transform: translateY(-14px) scale(.97, 1.05); } 36% { transform: translateY(0) scale(1.05, .93); } 46% { transform: translateY(0) scale(1, 1); } }
@keyframes hopGround { 0%, 8%, 36%, 55%, 100% { transform: none; opacity: 1; } 22% { transform: scale(.78); opacity: .55; } }
@keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
@keyframes melt { from { transform: scale(1, 1); } to { transform: scale(1.035, .955); } }
@keyframes drip { 0%, 30% { opacity: 0; transform: translateY(-2px); } 40% { opacity: 1; transform: translateY(0); } 85% { opacity: 1; transform: translateY(16px); } 100% { opacity: 0; transform: translateY(20px); } }
@keyframes wobble { from { transform: rotate(-2.5deg); } to { transform: rotate(2.5deg); } }
@keyframes wobble-hard { from { transform: rotate(-5deg); } to { transform: rotate(4deg); } }
@keyframes gust { 0%, 100% { transform: rotate(-1.5deg); } 30% { transform: rotate(-5deg); } 45% { transform: rotate(-2.5deg); } 70% { transform: rotate(-6deg); } }

/* clothes are real objects: old pieces get tossed, new pieces drop on and land */
.piece { transform-box: fill-box; transform-origin: 50% 50%; }
.piece.on { animation: pieceOn .62s cubic-bezier(.3, 1.3, .5, 1) var(--delay, 0s) both; }
.piece.off { animation: pieceOff .38s cubic-bezier(.45, 0, .85, .5) var(--delay, 0s) forwards; }
@keyframes pieceOn {
  0% { opacity: 0; transform: translate(var(--fx), var(--fy)) rotate(var(--fr)); }
  30% { opacity: 1; }
  100% { opacity: 1; transform: none; }
}
@keyframes pieceOff {
  0% { opacity: 1; transform: none; }
  55% { opacity: 1; }
  100% { opacity: 0; transform: translate(var(--ox), var(--oy)) rotate(var(--or)); }
}
.lw.in { animation: lwIn .34s var(--ease-out) var(--delay, 0s) both; transform-box: fill-box; }
.lw.out { animation: lwOut .16s ease-in forwards; }
@keyframes lwIn { from { opacity: 0; transform: translateY(-9px); } to { opacity: 1; transform: none; } }
@keyframes lwOut { to { opacity: 0; } }

/* the big number and its caption */
.read { flex: none; position: relative; text-align: center; touch-action: pan-y; user-select: none; -webkit-user-select: none; transition: transform .5s var(--ease-out), opacity .3s ease; }
.hero {
  height: 1.06em; line-height: 1.06;
  font-size: clamp(56px, 10.2vh, 78px); font-weight: 700; letter-spacing: -.012em;
  white-space: nowrap; font-variant-numeric: tabular-nums;
  overflow: hidden;
}
.hero .d { display: inline-block; }
.hero .d.out { animation: digitOut .11s ease-in forwards; }
.hero .d.in { animation: digitIn .34s var(--ease-out) calc(var(--i, 0) * 24ms) both; }
@keyframes digitOut { to { opacity: 0; transform: translateY(-.28em); } }
@keyframes digitIn { from { opacity: 0; transform: translateY(.34em); } to { opacity: 1; transform: none; } }
.sub {
  height: 22px; line-height: 22px; margin-top: 2px; padding-inline: 8px;
  font-size: 15px; color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transition: opacity .11s ease, transform .11s ease;
}
.sub b { color: var(--ink); font-weight: 700; }
.sub i { font-style: normal; color: var(--faint); padding-inline: 5px; }
.swap { opacity: 0 !important; }
.sub.swap, .say.swap { transform: translateY(-3px); }
.nav {
  position: absolute; top: 12px; width: 36px; height: 48px;
  display: none; place-items: center;
  color: var(--faint);
}
.nav:hover { color: var(--ink); }
.nav svg { width: 15px; height: 15px; }
.nav[disabled] { opacity: 0; pointer-events: none; }
#prevBtn { left: -6px; }
#nextBtn { right: -6px; }
@media (hover: hover) and (pointer: fine) { .nav { display: grid; } }

/* the hourly strip: the selected hour glides to the middle */
.hours {
  flex: none; position: relative;
  display: flex;
  height: 62px; margin-top: 8px; margin-inline: -16px;
  box-sizing: border-box; padding-left: calc(50% - 24px);
  overflow-x: auto; overflow-y: hidden;
  scrollbar-width: none;
  overscroll-behavior-x: contain;
  -webkit-overflow-scrolling: touch;
  -webkit-mask-image: linear-gradient(90deg, transparent 2%, #000 13%, #000 87%, transparent 98%);
  mask-image: linear-gradient(90deg, transparent 2%, #000 13%, #000 87%, transparent 98%);
  transition: opacity .11s ease;
}
.hours::-webkit-scrollbar { display: none; }
.hours::after { content: ""; flex: 0 0 calc(50% - 24px); }
.hr {
  position: relative; z-index: 1;
  flex: 0 0 48px; height: 62px; box-sizing: border-box;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  border-radius: 15px; color: var(--muted);
}
.hr[aria-pressed="true"] { color: var(--ink); }
.hr .hl { font-size: 11.5px; line-height: 14px; white-space: nowrap; }
.hr.now .hl { font-weight: 700; color: var(--ink); }
.hr svg { width: 17px; height: 17px; }
.hr .hv { font-size: 13.5px; line-height: 16px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sel-ind {
  position: absolute; top: 0; left: 0; width: 48px; height: 62px;
  border-radius: 15px; background: var(--chip-hover);
  opacity: 0; pointer-events: none;
  transition: transform .45s var(--ease-out), opacity .2s;
}
.hours.no-anim .sel-ind { transition: none; }
.hr.sk .bar { display: block; border-radius: 6px; background: var(--chip); animation: shimmer 1.3s ease-in-out infinite; }
.hr.sk .bar.a { width: 26px; height: 10px; }
.hr.sk .bar.b { width: 18px; height: 18px; border-radius: 50%; }
.hr.sk .bar.c { width: 24px; height: 11px; }
@keyframes shimmer { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }

/* the sentence: two lines reserved, so the screen doesn't jump when it changes */
.say {
  flex: none; min-height: 44px; margin-top: 10px; padding-inline: 4px;
  display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 0;
  text-align: center; font-size: 15px; line-height: 22px;
  text-wrap: balance;
  transition: opacity .12s ease, transform .12s ease;
}
.say p { margin: 0; max-width: 100%; }
.say .a { color: var(--ink); font-weight: 700; }
.say .b { color: var(--muted); font-weight: 400; }
.say[data-kind="sum"] .a { color: var(--muted); font-weight: 400; }
.say[data-kind="rain"] .a { color: var(--rain); font-weight: 700; }
.say .drop { display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: -1px; fill: currentColor; }

.actions { flex: none; margin-top: 8px; display: flex; justify-content: center; gap: 8px; white-space: nowrap; }
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--chip); color: var(--muted);
  font-weight: 700; font-size: 13px; line-height: 18px;
  padding: 9px 14px; border-radius: 999px;
}
.pill:hover { background: var(--chip-hover); color: var(--ink); }
.pill svg { width: 14px; height: 14px; flex: none; }
.pill.hot svg { color: #f08c5a; }
.pill.cold svg { color: #9cc4ff; }
.pill.busy svg { animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (max-width: 380px) { .actions { gap: 6px; } .pill { padding: 9px 10px; font-size: 12px; } }
@media (max-width: 335px) { .actions { flex-wrap: wrap; } }
.foot { flex: none; margin-top: auto; padding-top: 8px; }
.note { font-size: 11px; line-height: 15px; color: var(--faint); margin: 0; min-height: 15px; text-align: center; }
.note a { color: inherit; }

/* short screens give up crab first, never legibility */
@media (max-height: 640px) { .say { margin-top: 6px; } .hours { margin-top: 4px; } }
@media (max-height: 520px) { .hero { font-size: 50px; } .say { min-height: 22px; } .foot { padding-top: 2px; } }

/* a phone on its side: crab on the left, everything else on the right */
@media (max-height: 500px) and (min-width: 560px) {
  .app { max-width: 860px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); grid-template-rows: auto auto auto 1fr auto auto; column-gap: 20px; overflow-y: auto; }
  .top { grid-column: 1 / -1; }
  .stage { grid-column: 1; grid-row: 2 / -1; max-height: none; min-height: 0; }
  .read, .hours, .say, .actions, .foot { grid-column: 2; }
  .hours { margin-inline: 0; }
  .hero { font-size: 46px; }
  .say { min-height: 22px; margin-top: 4px; }
  .actions { margin-top: 4px; }
}

.top { flex: none; position: relative; z-index: 3; }
/* flying clothes pass behind the words, never over them */
.read, .hours, .say, .actions, .foot { z-index: 2; }
.say, .actions, .foot { position: relative; }
@media (hover: hover) { .hr:hover { background: var(--chip); } .hr[aria-pressed="true"]:hover { background: transparent; } }

/* sheets */
.sheet-wrap { position: absolute; inset: 0; z-index: 10; display: flex; align-items: flex-end; justify-content: center; }
.backdrop { position: absolute; inset: 0; background: var(--scrim); opacity: 0; transition: opacity .35s var(--ease-out); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.sheet {
  position: relative;
  width: 100%; max-width: 430px; max-height: 82%;
  box-sizing: border-box;
  background: var(--sheet);
  border-radius: 26px 26px 0 0;
  padding-inline: 18px;
  padding-block: 14px calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 12px;
  transform: translateY(104%);
  transition: transform .5s var(--ease-out);
  box-shadow: 0 -8px 30px rgba(0, 0, 0, .45);
}
.sheet-wrap.open .backdrop { opacity: 1; }
.sheet-wrap.open .sheet { transform: none; }
.grab { position: relative; width: 38px; height: 4px; border-radius: 4px; background: var(--line); align-self: center; cursor: grab; }
.grab::after { content: ""; position: absolute; inset: -14px -60px; }
.grab, .sheet-head { touch-action: none; }
.sheet.dragging { transition: none; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; }
.sheet-head h2 { margin: 0; font-size: 18px; font-weight: 700; }
.list { list-style: none; margin: 0; padding: 0; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; }
.list li:not(.sec) + li:not(.sec) { border-top: 1px dashed var(--line); }
.list .sec { position: sticky; top: 0; z-index: 1; background: var(--sheet); font-size: 12px; font-weight: 700; color: var(--faint); letter-spacing: .06em; padding: 12px 6px 4px; }
#citySheet .sheet { height: 82%; }
.row {
  width: 100%; text-align: left;
  display: grid; align-items: center; gap: 12px;
  padding: 8px 6px; border-radius: 12px;
}
.row:hover { background: var(--chip); }
.row.sel { background: var(--chip); }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; overflow-y: auto; min-height: 0; }
.cal-day {
  min-width: 0; padding-block: 7px 8px; border-radius: 12px;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.cal-day:hover, .cal-day.sel { background: var(--chip); }
.cal-day.today { box-shadow: inset 0 0 0 1.5px var(--faint); }
.cal-day .wd { font-size: 10px; line-height: 12px; color: var(--muted); }
.cal-day .dn { font-size: 14px; line-height: 17px; font-weight: 700; }
.cal-day .mini { width: 100%; max-width: 44px; aspect-ratio: 240 / 200; margin-block: 2px; }
.cal-day .mini svg { width: 100%; height: 100%; display: block; }
.cal-day .t1 { font-size: 13px; line-height: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
.cal-day .t2 { font-size: 11px; line-height: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.sheet-sub { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 6px; }
.row b { font-size: 15px; display: block; }
.row small { font-size: 12px; color: var(--muted); }
.row .t { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 15px; white-space: nowrap; }
.row .t span { color: var(--muted); font-size: 13px; }
.city-row { grid-template-columns: 1fr auto; }
.city-row small { display: block; }
.city-row .t { font-size: 14px; color: var(--muted); font-weight: 400; }
.search {
  display: flex; align-items: center; gap: 8px;
  background: var(--chip); border-radius: 14px;
  padding: 10px 12px; color: var(--muted);
}
.search svg { width: 15px; height: 15px; flex: none; }
.search input { border: 0; background: transparent; font: inherit; font-size: 16px; color: var(--ink); width: 100%; min-width: 0; outline: none; }
.search input::placeholder { color: var(--faint); }
.loc-btn { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-weight: 700; font-size: 14px; padding: 4px 6px; align-self: flex-start; }
.loc-btn svg { width: 12px; height: 12px; }
.sheet-note { font-size: 12px; color: var(--muted); margin: 0; text-align: center; }

/* widget preview */
.home {
  border-radius: 22px;
  background: linear-gradient(170deg, var(--wall-a), var(--wall-b));
  padding: 18px 16px 16px;
  display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px;
}
.w { display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 0; }
.w label { font-size: 11px; color: #f4f1ea; font-weight: 700; }
.w-medium { grid-column: 1 / -1; }
.wbox {
  position: relative; width: 100%;
  background: var(--widget); border-radius: 20px;
  overflow: hidden;
  display: grid; place-items: center;
}
.w-medium .wbox { aspect-ratio: 2.15 / 1; }
.w-small .wbox { aspect-ratio: 1; }
.wbox .wglow { position: absolute; left: 50%; top: 46%; width: 62%; aspect-ratio: 1; translate: -50% -50%; border-radius: 50%; background: radial-gradient(closest-side, var(--glow) 0%, var(--glow) 40%, color-mix(in srgb, var(--glow) 0%, transparent) 100%); }
.w-medium .wbox .wglow { width: 34%; }
.wbox .wcat { position: relative; height: 56%; aspect-ratio: 240 / 200; margin-top: -8%; }
.wbox .wcat svg { width: 100%; height: 100%; display: block; }
.wbox .wt { position: absolute; bottom: 9px; font-size: 11px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.wbox .wt.l { left: 13px; } .wbox .wt.r { right: 13px; color: var(--ink); }
.w-icons { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-content: start; }
.app-icon { width: 100%; max-width: 64px; aspect-ratio: 1; border-radius: 15px; background: var(--widget); display: grid; place-items: center; overflow: hidden; position: relative; }
.app-icon svg { width: 90%; height: 90%; margin-top: 6%; }
.ghost { background: rgba(255, 255, 255, .1); }

.glow, .wbox .wglow { opacity: var(--glow-o); }

button { -webkit-tap-highlight-color: transparent; }
.round, .pill, .city, .hr, .row, .cal-day, .nav, .loc-btn, .units button {
  transition: transform .22s var(--ease-out), background-color .25s ease, color .25s ease, opacity .25s ease;
}
.round:active, .pill:active, .city:active, .row:active, .cal-day:active, .loc-btn:active { transform: scale(.95); }
.hr:active { transform: scale(.94); }
@media (prefers-reduced-motion: reduce) {
  .crab *, .glow, .hero .d, .hr.sk .bar { animation: none !important; }
  .sheet, .backdrop, .glow, .sel-ind, .units::before, .sub, .say, .hours, .cat-stack, .read { transition: none; }
}

    let tier = feels < 3 ? "bundle" : feels < 10 ? "coat" : feels < 16 ? "sweater" : feels < 22 ? "light" : feels < 28 ? "tee" : "hot";
    if (Math.round(d.max * 9 / 5 + 32) >= 100) tier = "scorch"; /* shown high of 100°F or more: swimsuit weather */
    if (Math.round(d.min * 9 / 5 + 32) <= 0) tier = "arctic"; /* shown low of 0°F or less: every layer it owns */
    const snow = isSnow(d.code);
    const rain = !snow && (isRain(d.code) || d.pop >= 70);
    if (snow && tier !== "bundle" && tier !== "coat" && tier !== "arctic") tier = "coat";
    const o = { tier, rain, snow, sunny: d.code <= 1, windy: d.wind >= 9 };
    o.move = moveFor(o);

  /* the same rules for a single hour: that hour's feels-like, sky, wind, and whether it's dark out */
  function dressForHour(x) {

    }
    const peak = hrs.reduce((p, q) => (q.t > p.t ? q : p));
    if (state.hour <= peak.h) return { kind: "sum", a: summaryLine(c, d, n, isToday), b: "" };
    const adv = adviceFor(c, d, n, isToday);
    return adv.a ? { kind: "tip", a: adv.a, b: adv.b } : { kind: "sum", a: summaryLine(c, d, n, isToday), b: "" };
  }
  const DROP = `<svg class="drop" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5C9 7 6 10.4 6 14a6 6 0 0 0 12 0c0-3.6-3-7-6-11.5z"/></svg>`;
  function setSay(s) {
    const html = `<p class="a">${s.kind === "rain" ? DROP : ""}${esc(s.a)}</p>${s.b ? `<p class="b">${esc(s.b)}</p>` : ""}`;
    swapText(sayEl, html, { kind: s.kind });
  }

  /* draws everything for the current city, day and hour */
  function render() {
    const c = state.city;
    if (!c) return;
    const days = c.days, d = days[state.idx], n = cityNow(c);
    const isToday = d.date === n.date, isNow = isToday && state.hour === n.hour;
    const x = state.hour != null ? hourFor(c, d.date, state.hour) : null;
    const o = x ? dressForHour(x) : dressFor(d);
    dress(o);
    document.documentElement.style.setProperty("--glow", glowFor(o));
    setFx(o.snow ? "snow" : o.rain ? "rain" : o.windy ? "wind" : o.tier === "scorch" ? "heat" : o.tier === "arctic" ? "frost" : null, o.windy);
    setHero(temp(x ? x.t : d.max));
    let sub;
    if (!x) sub = `<b>${dayLabel(d, n)}</b><i>·</i>${CODES[d.code] || "mixed skies"}`;
    else if (isNow) {
      const tail = c.extreme ? `${condName(x.code, x.day)}, ${esc((c.st || "").toLowerCase())}` : Math.abs(x.f - x.t) * 1.8 >= 2 ? `feels like ${temp(x.f)}` : condName(x.code, x.day);
      sub = `<b>now</b><i>·</i>${clockText(n)}<i>·</i>${tail}`;
    } else {
      sub = `<b>${isToday ? hourLabel(state.hour) : `${dayLabel(d, n)}, ${hourLabel(state.hour)}`}</b><i>·</i>${condName(x.code, x.day)}`;
    }
    swapText(subEl, sub);
    setSay(sayFor(c, d, x, n, isToday, isNow));
    prevBtn.disabled = state.idx === 0;
    nextBtn.disabled = state.idx === days.length - 1;
    const rl = rainLine(c, d);
    $("#live").textContent = `${dayLabel(d, n)}: ${x ? `at ${hourLabel(state.hour)} it's ${temp(x.t)}, ${condName(x.code, x.day)}. ` : ""}high ${temp(d.max)}, low ${temp(d.min)}. the crab is wearing ${wearText(o)} and ${MOVE_TEXT[o.move]}${o.windy ? ", leaning into the wind" : ""}.${rl ? " " + rl + "." : ""}`;
  }

  /* first visit: a bare crab waits while we find the weather, then gets dressed */
  function showLoading() {
    app.classList.add("loading");
    $("#cityName").textContent = "finding you…";
    heroEl.innerHTML = `<span class="d" style="color:var(--faint)">··°</span>`;
    subEl.innerHTML = "checking the sky";
    let sk = "";
    for (let i = 0; i < 9; i++) sk += `<span class="hr sk" aria-hidden="true"><span class="bar a"></span><span class="bar b"></span><span class="bar c"></span></span>`;
    hoursEl.innerHTML = sk;
    document.documentElement.style.setProperty("--glow", "#4b5a6e");
  }

  /* ---------- rain timing: 15-minute slots for the next few hours, hourly after that ---------- */
  const isWet = (c) => c != null && (isRain(c) || isSnow(c));
  const localMs = (iso, off) => Date.parse(iso.length === 13 ? iso + ":00:00Z" : iso + ":00Z") - (off || 0) * 1000;
  function slotsOf(city) {
    if (city._slots) return city._slots;
    const out = [];
    let mS = Infinity, mE = -Infinity;
    if (city.m && city.m.length && city.m0) {
      mS = localMs(city.m0, city.off);
      city.m.forEach((c, i) => out.push({ s: mS + i * 9e5, e: mS + (i + 1) * 9e5, c }));
      mE = mS + city.m.length * 9e5;
    }
    if (city.h && city.h0) {
      const b = localMs(city.h0, city.off);
      city.h.forEach((c, i) => {
        const s = b + i * 36e5, e = s + 36e5;
        if (e <= mS || s >= mE) out.push({ s, e, c });
        else { if (s < mS) out.push({ s, e: mS, c }); if (e > mE) out.push({ s: mE, e, c }); }
      });
    }
    out.sort((a, b) => a.s - b.s);
    return (city._slots = out);
  }
  function fmtDur(ms) {
    const m = Math.max(1, Math.round(ms / 6e4));
    if (m < 60) return `${m} minute${m === 1 ? "" : "s"}`;
    if (m < 180) { const h = Math.floor(m / 60), r = m % 60; return r ? `${h} hr ${r} min` : `${h} hour${h > 1 ? "s" : ""}`; }
    return `${Math.round(m / 60)} hours`;
  }
  const worst = (codes) => codes.reduce((a, b) => (b > a ? b : a), 0);
  function spellFrom(sl, k) {
    let j = k;
    while (j + 1 < sl.length && isWet(sl[j + 1].c) && sl[j + 1].s <= sl[j].e) j++;
    return { s: sl[k].s, e: sl[j].e, c: worst(sl.slice(k, j + 1).map((x) => x.c)) };
  }
  /* minute-accurate rain timing for right now on today; "" for any other day or when it's dry for a while */
  function rainLine(city, d) {
    const sl = slotsOf(city);
    if (!sl.length) return "";
    const now = Date.now(), dayStart = localMs(d.date + "T00:00", city.off);
    if (now < dayStart || now >= dayStart + 864e5) return "";
    const i = sl.findIndex((x) => x.s <= now && now < x.e);
    if (i < 0) return "";
    if (isWet(sl[i].c)) return `${CODES[sl[i].c]} for the next ${fmtDur(spellFrom(sl, i).e - now)}`;
    const k = sl.findIndex((x, n) => n > i && isWet(x.c));
    return k >= 0 && sl[k].s - now <= 3 * 36e5 ? `${CODES[sl[k].c]} starting in ${fmtDur(sl[k].s - now)}` : "";
  }

  function go(i) {
    const n = state.city.days.length;
    i = Math.max(0, Math.min(n - 1, i));
    if (i === state.idx) return;
    state.idx = i;
    state.followNow = false;
    renderStrip(true);
    render();
  }

  /* swipe the crab or the number to change day; everything follows your finger */
  (() => {
    let sw = null;
    const resetDrag = () => {
      app.classList.remove("swiping");
      catStack.style.transform = catStack.style.opacity = readEl.style.transform = readEl.style.opacity = "";
    };
    [stageEl, readEl].forEach((area) => {
      area.addEventListener("pointerdown", (e) => {
        if (e.button || !state.city || e.target.closest("button")) return;
        sw = { x: e.clientX, y: e.clientY, t: performance.now(), on: false, id: e.pointerId };
      });
      area.addEventListener("pointermove", (e) => {
        if (!sw) return;
        const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
        if (!sw.on) {
          if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.2) {
            sw.on = true;
            area.setPointerCapture?.(sw.id);
            app.classList.add("swiping");
          } else if (Math.abs(dy) > 14) { sw = null; return; } else return;
        }
        const edge = (dx > 0 && state.idx === 0) || (dx < 0 && state.idx === state.city.days.length - 1);
        const k = edge ? .25 : 1, fade = Math.min(.6, Math.abs(dx * k) / 420);
        catStack.style.transform = `translateX(${(dx * .55 * k).toFixed(1)}px) rotate(${(dx * .012 * k).toFixed(2)}deg)`;
        catStack.style.opacity = (1 - fade).toFixed(3);
        readEl.style.transform = `translateX(${(dx * .32 * k).toFixed(1)}px)`;
        readEl.style.opacity = (1 - fade).toFixed(3);
      });
      const end = (e) => {
        if (!sw) return;
        const s = sw;
        sw = null;
        if (!s.on) return;
        const dx = e.clientX - s.x, speed = dx / Math.max(1, performance.now() - s.t);
        resetDrag();
        if (Math.abs(dx) > 64 || Math.abs(speed) > .45) go(state.idx + (dx < 0 ? 1 : -1));
      };
      area.addEventListener("pointerup", end);
      area.addEventListener("pointercancel", () => { sw = null; resetDrag(); });
    });
  })();
  hoursEl.addEventListener("click", (e) => {
    const b = e.target.closest(".hr[data-h]");
    if (!b || !state.city) return;
    state.hour = +b.dataset.h;
    const n = cityNow(state.city);
    state.followNow = state.city.days[state.idx].date === n.date && state.hour === n.hour;
    hoursEl.querySelectorAll(".hr").forEach((x) => x.setAttribute("aria-pressed", String(+x.dataset.h === state.hour)));
    placeStrip(true);
    render();
    navigator.vibrate?.(6);
  });
  prevBtn.addEventListener("click", () => go(state.idx - 1));
  nextBtn.addEventListener("click", () => go(state.idx + 1));
  document.addEventListener("keydown", (e) => {
    if (openSheet) { if (e.key === "Escape") closeSheet(); return; }
    if (!state.city || (e.target.closest && e.target.closest("input"))) return;
    if (e.key === "ArrowLeft") { e.preventDefault(); go(state.idx - 1); }
    if (e.key === "ArrowRight") { e.preventDefault(); go(state.idx + 1); }
  });
  new ResizeObserver(() => { sizeFx(); placeStrip(false); }).observe(app);

  /* unit switch: both units always visible, the one in use is filled in */
  const unitF = $("#unitF"), unitC = $("#unitC");
  function renderUnit() {
    $(".units").dataset.unit = state.unit;
    unitF.setAttribute("aria-pressed", String(state.unit === "f"));
    unitC.setAttribute("aria-pressed", String(state.unit === "c"));
  }
  function setUnit(u) {
    if (u === state.unit) return;
    state.unit = u;
    renderUnit();
    if (state.city) { renderStrip(false); render(); }
    const cur = store.get(); cur.unit = state.unit; store.set(cur);
  }
  unitF.addEventListener("click", () => setUnit("f"));
  unitC.addEventListener("click", () => setUnit("c"));

  function renderNote() {
    const note = $("#note");
    const credit = `<a href="https://open-meteo.com" target="_blank" rel="noopener">open-meteo</a>`;
    note.innerHTML = state.live ? `live forecast · ${credit}` : `forecast saved ${shortDate(SNAP.fetched)} · ${credit}`;
  }

  /* ---------- rain, snow & wind ---------- */
  const fx = { cv: $("#fx"), ctx: null, mode: null, key: "", windy: false, parts: [], raf: 0, last: 0, w: 0, h: 0 };
  fx.ctx = fx.cv.getContext("2d");
  function sizeFx() {
    const r = fx.cv.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
    fx.w = r.width; fx.h = r.height;
    fx.cv.width = Math.round(r.width * dpr); fx.cv.height = Math.round(r.height * dpr);
    fx.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  const slantNow = () => (fx.windy ? .45 : .1);
  function spawn(p, initial) {
    if (fx.mode === "frost") {
      p.x = fx.w * (.1 + Math.random() * .8); p.y = fx.h * (.1 + Math.random() * .8);
      p.ph = Math.random() * 6.28; p.v = 1.2 + Math.random() * 1.6; p.r = 2 + Math.random() * 3;
      return p;
    }
    if (fx.mode === "heat") {
      p.x = fx.w * (.12 + Math.random() * .76);
      p.y = initial ? Math.random() * fx.h : fx.h + 10;
      p.v = 18 + Math.random() * 16; p.len = 22 + Math.random() * 16; p.ph = Math.random() * 6.28;
      return p;
    }
    if (fx.mode === "wind") {
      p.x = initial ? Math.random() * fx.w : -20 - Math.random() * 80;
      p.y = fx.h * (.15 + Math.random() * .7);
      p.v = 170 + Math.random() * 120; p.len = 18 + Math.random() * 26; p.ph = Math.random() * 6.28;
      return p;
    }
    const sl = slantNow();
    p.x = Math.random() * (fx.w + fx.h * sl) - fx.h * sl;
    p.y = initial ? Math.random() * fx.h : -12;
    if (fx.mode === "rain") { p.v = 230 + Math.random() * 120; p.len = 7 + Math.random() * 6; }
    else { p.v = 22 + Math.random() * 26; p.r = 1.4 + Math.random() * 2; p.ph = Math.random() * 6.28; }
    return p;
  }
  function setFx(mode, windy) {
    if (reduced) mode = null;
    const key = mode + "|" + !!windy;
    if (key === fx.key) return;
    fx.key = key; fx.mode = mode; fx.windy = !!windy;
    if (!fx.w) sizeFx();
    const n = mode === "rain" ? 34 : mode === "snow" ? 40 : mode === "wind" ? 9 : mode === "heat" ? 12 : mode === "frost" ? 18 : 0;
    fx.parts = Array.from({ length: n }, () => spawn({}, true));
    if (mode && !fx.raf) { fx.last = performance.now(); fx.raf = requestAnimationFrame(tick); }
    if (!mode) fx.ctx.clearRect(0, 0, fx.w, fx.h);
  }
  function tick(now) {
    const dt = Math.min(.05, (now - fx.last) / 1000); fx.last = now;
    const c = fx.ctx; c.clearRect(0, 0, fx.w, fx.h);
    if (!fx.mode) { fx.raf = 0; return; }
    const sl = slantNow();
    if (fx.mode === "rain") {
      c.strokeStyle = "rgba(160,195,230,.55)"; c.lineWidth = 1.5; c.lineCap = "round"; c.beginPath();
      for (const p of fx.parts) { p.y += p.v * dt; p.x += p.v * dt * sl; if (p.y > fx.h + 10) spawn(p); c.moveTo(p.x, p.y); c.lineTo(p.x - p.len * sl, p.y - p.len); }
      c.stroke();
    } else if (fx.mode === "snow") {
      c.fillStyle = "rgba(240,245,255,.9)";
      for (const p of fx.parts) {
        p.y += p.v * dt; p.ph += dt * 1.4; p.x += (fx.windy ? 45 : 0) * dt;
        const x = p.x + Math.sin(p.ph) * 6;
        if (p.y > fx.h + 8 || x > fx.w + 10) spawn(p);
        c.beginPath(); c.arc(x, p.y, p.r, 0, 6.283); c.fill();
      }
    } else if (fx.mode === "frost") {
      c.lineWidth = 1.4; c.lineCap = "round";
      for (const p of fx.parts) {
        p.ph += dt * p.v;
        const a = Math.max(0, Math.sin(p.ph));
        if (p.ph > 6.28) { p.ph -= 6.28; p.x = fx.w * (.1 + Math.random() * .8); p.y = fx.h * (.1 + Math.random() * .8); }
        c.strokeStyle = `rgba(225,238,255,${(a * .8).toFixed(2)})`;
        c.beginPath(); c.moveTo(p.x - p.r, p.y); c.lineTo(p.x + p.r, p.y); c.moveTo(p.x, p.y - p.r); c.lineTo(p.x, p.y + p.r); c.stroke();
      }
    } else if (fx.mode === "heat") {
      c.strokeStyle = "rgba(255,190,140,.22)"; c.lineWidth = 1.6; c.lineCap = "round";
      for (const p of fx.parts) {
        p.y -= p.v * dt; p.ph += dt * 2.4;
        if (p.y + p.len < -10) spawn(p);
        c.beginPath();
        for (let k = 0; k <= 6; k++) { const yy = p.y - (p.len * k) / 6, xx = p.x + Math.sin(p.ph + k * .9) * 3; k ? c.lineTo(xx, yy) : c.moveTo(xx, yy); }
        c.stroke();
      }
    } else {
      c.strokeStyle = "rgba(225,230,240,.3)"; c.lineWidth = 1.6; c.lineCap = "round";
      for (const p of fx.parts) {
        p.x += p.v * dt; p.ph += dt * 3;
        if (p.x - p.len > fx.w + 10) spawn(p);
        const y = p.y + Math.sin(p.ph) * 3;
        c.beginPath(); c.moveTo(p.x - p.len, y); c.quadraticCurveTo(p.x - p.len / 2, y - 3, p.x, y); c.stroke();
      }
    }
    fx.raf = requestAnimationFrame(tick);
  }
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && fx.raf) { cancelAnimationFrame(fx.raf); fx.raf = 0; }
    else if (!document.hidden && fx.mode && !fx.raf) { fx.last = performance.now(); fx.raf = requestAnimationFrame(tick); }
  });

  /* ---------- sheets ---------- */
  let openSheet = null, returnFocus = null;
  function showSheet(el, focusSel) {
    returnFocus = document.activeElement;
    el.hidden = false;
    openSheet = el;
    void el.offsetHeight;
    el.classList.add("open");
    setTimeout(() => (el.querySelector(focusSel) || el.querySelector("[data-close].round"))?.focus({ preventScroll: true }), reduced ? 0 : 60);
  }
  function closeSheet() {
    const el = openSheet; if (!el) return;
    openSheet = null;
    el.classList.remove("open");
    setTimeout(() => { el.hidden = true; }, reduced ? 0 : 320);
    returnFocus?.focus?.({ preventScroll: true });
  }
  document.querySelectorAll(".sheet-wrap").forEach((w) => w.addEventListener("click", (e) => { if (e.target.closest("[data-close]")) closeSheet(); }));
  /* drag a sheet down by its handle or title to close it */
  document.querySelectorAll(".sheet").forEach((sheet) => {
    let y0 = null, dy = 0, t0 = 0;
    sheet.addEventListener("pointerdown", (e) => {
      if (!e.target.closest(".grab, .sheet-head") || e.target.closest("button")) return;
      y0 = e.clientY; dy = 0; t0 = performance.now();
      sheet.classList.add("dragging");
      sheet.setPointerCapture?.(e.pointerId);
    });
    sheet.addEventListener("pointermove", (e) => {
      if (y0 == null) return;
      dy = Math.max(0, e.clientY - y0);
      sheet.style.transform = `translateY(${dy}px)`;
    });
    const end = () => {
      if (y0 == null) return;
      const speed = dy / Math.max(1, performance.now() - t0);
      y0 = null;
      sheet.classList.remove("dragging");
      sheet.style.transform = "";
      if (dy > 90 || (dy > 20 && speed > .5)) closeSheet();
    };
    sheet.addEventListener("pointerup", end);
    sheet.addEventListener("pointercancel", end);
  });

  /* ---------- hottest / coldest place on earth right now ---------- */
  async function findExtreme(kind) {
    const list = (SNAP.extremes && SNAP.extremes[kind]) || [];
    if (!list.length) return null;
    const better = (a, b) => (kind === "hot" ? a > b : a < b);
    if (state.live) {
      try {
        const r = await getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${list.map((c) => c.lat).join(",")}&longitude=${list.map((c) => c.lon).join(",")}&current=temperature_2m`, 10000);
        const arr = Array.isArray(r) ? r : [r];
        let best = null;
        arr.forEach((x, i) => { const t = x?.current?.temperature_2m; if (t != null && list[i] && (!best || better(t, best.t))) best = { c: list[i], t }; });
        if (best) return { ...best, n: list.length };
      } catch (e) {}
    }
    let best = null;
    for (const c of list) {
      if (!c.ht || !c.h0) continue;
      const v = c.ht[Math.floor((Date.now() - localMs(c.h0, c.off)) / 36e5)];
      if (v != null && (!best || better(v / 10, best.t))) best = { c, t: v / 10 };
    }
    return best ? { ...best, n: list.length } : null;
  }
  async function goExtreme(kind, btn) {
    if (!state.city || btn.classList.contains("busy")) return;
    btn.classList.add("busy"); btn.setAttribute("aria-busy", "true");
    const found = await findExtreme(kind);
    let city = null;
    if (found) {
      const c = found.c;
      const base = {
        name: c.name.toLowerCase(), full: `${c.name}, ${c.st}`, st: c.st, lat: c.lat, lon: c.lon, tz: c.tz, extreme: kind,
        place: kind === "hot" ? "the world's hottest right now" : "the world's coldest right now",
        note: `${kind === "hot" ? "hottest" : "coldest"} of ${found.n} ${kind === "hot" ? "hot" : "cold"} spots we check right now.`
      };
      if (state.live) city = await loadLive(base);
      if (!city && c.daily) city = { ...base, days: toDays(c.daily), off: c.off, h0: c.h0, h: c.h, ht: c.ht, hf: c.hf, hw: c.hw, hd: c.hd, m0: c.m0, m: c.m };
    }
    btn.classList.remove("busy"); btn.removeAttribute("aria-busy");
    if (!city) {
      state.flash = "couldn't check the world's temperatures. try again in a moment.";
      render();
      setTimeout(() => { state.flash = ""; render(); }, 3600);
      return;
    }
    setCity(city);
  }
  $("#hotBtn").addEventListener("click", (e) => goExtreme("hot", e.currentTarget));
  $("#coldBtn").addEventListener("click", (e) => goExtreme("cold", e.currentTarget));

  /* dates sheet */
  $("#moreBtn").addEventListener("click", () => {
    if (!state.city) return;
    const days = state.city.days;
    let start = days.findIndex((d) => d.date === state.today);
    if (start < 0) start = 0;
    const two = days.slice(start, start + 14);
    $("#datesRange").textContent = two.length ? `${shortDate(two[0].date)} – ${shortDate(two[two.length - 1].date)}` : "";
    $("#dateList").innerHTML = two.map((d, k) => {
      const i = start + k, o = dressFor(d), wd = dayName(d.date, state.today);
      const label = d.date === state.today ? "today" : WEEK[utc(d.date).getUTCDay()].slice(0, 3);
      return `<button class="cal-day${i === state.idx ? " sel" : ""}${d.date === state.today ? " today" : ""}" data-i="${i}" aria-label="${wd}, ${shortDate(d.date)}: high ${temp(d.max)}, low ${temp(d.min)}, ${CODES[d.code] || ""}"${i === state.idx ? ' aria-current="true"' : ""}>
        <span class="wd">${label}</span><span class="dn">${utc(d.date).getUTCDate()}</span>
        <span class="mini">${crabSVG(o, { flat: true })}</span>
        <span class="t1">${temp(d.max)}</span><span class="t2">${temp(d.min)}</span>
      </button>`;
    }).join("");
    showSheet($("#datesSheet"), ".cal-day.sel");
  });
  $("#dateList").addEventListener("click", (e) => {
    const b = e.target.closest("[data-i]"); if (!b) return;
    const i = +b.dataset.i;
    closeSheet();
    setTimeout(() => go(i), reduced ? 0 : 200);
  });

  /* city sheet */
  const cityList = $("#cityList"), cityMsg = $("#cityMsg"), citySearch = $("#citySearch");
  const esc = (s) => String(s).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  const GROUPS = [["cap", "state capitals"], ["big", "biggest cities"], ["ca", "more california"], ["fl", "more florida"], ["ny", "more new york"], ["tx", "more texas"], ["world", "around the world"]];
  function subText(c) {
    if (c.sub != null) return c.sub;
    if (c.g === "cap") return c.abbr === "DC" ? "us capital" : `${c.st.toLowerCase()} · state capital`;
    return (c.st || "").toLowerCase();
  }
  function cityRow(c, key) {
    let t = "";
    if (!state.live && c.days) {
      const d = c.days.find((x) => x.date === todayIn(c.tz)) || c.days[1];
      if (d) t = `${temp(d.max)} / ${temp(d.min)}`;
    }
    const sel = state.city && c.full === state.city.full;
    return `<li><button class="row city-row${sel ? " sel" : ""}" data-key="${key}"${sel ? ' aria-current="true"' : ""}>
      <span><b>${esc(c.name)}</b><small>${esc(subText(c))}</small></span>
      <span class="t">${t}</span></button></li>`;
  }
  function savedHits(q) {
    const ql = q.trim().toLowerCase();
    const all = snapCities.map((c, i) => i);
    if (!ql) return all;
    return all.filter((i) => {
      const c = snapCities[i];
      return c.name.includes(ql) || c.st.toLowerCase().includes(ql) || (ql.length === 2 && c.abbr.toLowerCase() === ql);
    });
  }
  function savedHTML(hits) {
    let html = "";
    for (const [g, label] of GROUPS) {
      const rows = hits.filter((i) => snapCities[i].g === g);
      if (rows.length) html += `<li class="sec" role="presentation">${label}</li>` + rows.map((i) => cityRow(snapCities[i], "s" + i)).join("");
    }
    return html;
  }
  let searchResults = [], searchT = 0, searchAbort = null;
  function renderCityList() {
    const q = citySearch.value;
    const hits = savedHits(q);
    cityList.innerHTML = savedHTML(hits);
    cityList.scrollTop = 0;
    searchResults = [];
    clearTimeout(searchT);
    searchAbort?.abort();
    if (!state.live) {
      cityMsg.textContent = hits.length ? (q.trim() ? "" : `${snapCities.length} places saved with this week's forecast`) : "nothing saved matches that. try a state name or a code like tx.";
      return;
    }
    cityMsg.textContent = "";
    if (q.trim().length < 2) return;
    searchT = setTimeout(async () => {
      searchAbort = new AbortController();
      cityMsg.textContent = "searching…";
      try {
        const r = await getJSON(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q.trim())}&count=8&language=en&format=json`, 6000, searchAbort.signal);
        const near = (a, b) => Math.abs(a.lat - b.lat) < .25 && Math.abs(a.lon - b.lon) < .25;
        searchResults = (r.results || []).map((x) => ({
          name: String(x.name).toLowerCase(),
          full: [x.name, x.admin1, x.country].filter(Boolean).join(", "),
          sub: [x.admin1, x.country].filter(Boolean).join(", ").toLowerCase(),
          lat: x.latitude, lon: x.longitude, tz: x.timezone
        })).filter((x) => !hits.some((i) => near(snapCities[i], x)));
        if (searchResults.length) cityList.insertAdjacentHTML("beforeend", `<li class="sec" role="presentation">more places</li>` + searchResults.map((c, i) => cityRow(c, "r" + i)).join(""));
        cityMsg.textContent = hits.length || searchResults.length ? "" : `no place called “${q.trim()}”. check the spelling and try again.`;
      } catch (e) {
        if (e.name !== "AbortError") cityMsg.textContent = "search isn't reachable right now. pick a saved place.";
      }
    }, 280);
  }
  citySearch.addEventListener("input", renderCityList);
  cityList.addEventListener("click", async (e) => {
    const b = e.target.closest("[data-key]"); if (!b) return;
    const k = b.dataset.key;
    const c = k[0] === "s" ? snapCities[+k.slice(1)] : searchResults[+k.slice(1)];
    if (!c) return;
    if (state.live) {
      cityMsg.textContent = "getting the forecast…";
      const live = await loadLive(c);
      if (live) { closeSheet(); setCity(live); return; }
      if (!c.days) { cityMsg.textContent = "couldn't reach the forecast. try again in a moment."; return; }
    }
    closeSheet();
    setCity(c);
  });
  $("#cityBtn").addEventListener("click", () => {
    citySearch.value = "";
    $("#locBtn").hidden = !(state.live && "geolocation" in navigator);
    citySearch.placeholder = state.live ? "search any city" : "search a city or state";
    renderCityList();
    showSheet($("#citySheet"), "#citySearch");
    requestAnimationFrame(() => { const sel = cityList.querySelector(".sel"); if (sel) cityList.scrollTop = Math.max(0, sel.offsetTop - cityList.clientHeight / 2); });
  });
  $("#locBtn").addEventListener("click", async () => {
    cityMsg.textContent = "finding you…";
    const live = await loadMyLocation();
    if (live) { closeSheet(); setCity(live); } else cityMsg.textContent = "couldn't find your location. search for your city instead.";
  });
  /* where are you? the precise spot if the browser allows it, otherwise a rough guess from the network */
  function preciseSpot() {
    return new Promise((res) => {
      if (!("geolocation" in navigator)) return res(null);
      const give = setTimeout(() => res(null), 15000);
      navigator.geolocation.getCurrentPosition(
        (p) => { clearTimeout(give); res({ lat: p.coords.latitude, lon: p.coords.longitude }); },
        () => { clearTimeout(give); res(null); },
        { timeout: 10000, maximumAge: 6e5 }
      );
    });
  }
  async function roughSpot() {
    try {
      const r = await getJSON("https://api.bigdatacloud.net/data/reverse-geocode-client", 6000);
      if (r.latitude != null && r.longitude != null) return { lat: r.latitude, lon: r.longitude, place: String(r.locality || r.city || "").toLowerCase() };
    } catch (e) {}
    return null;
  }
  async function loadMyLocation() {
    const spot = (await preciseSpot()) || (await roughSpot());
    if (!spot) return null;
    const c = { name: "my location", full: "current location", sub: "", lat: +spot.lat.toFixed(2), lon: +spot.lon.toFixed(2), loc: true };
    const [live, place] = await Promise.all([loadLive(c), spot.place ? spot.place : placeName(spot.lat, spot.lon)]);
    if (live) live.place = place;
    return live;
  }

  /* the town you're in, for "my location": BigDataCloud's free browser lookup, else the nearest saved place */
  async function placeName(lat, lon) {
    try {
      const r = await getJSON(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`, 6000);
      const n = r.locality || r.city || r.principalSubdivision;
      if (n) return String(n).toLowerCase();
    } catch (e) {}
    let best = null, bestKm = Infinity;
    for (const c of snapCities) {
      const km = Math.hypot((c.lat - lat) * 111, (c.lon - lon) * 111 * Math.cos((lat * Math.PI) / 180));
      if (km < bestKm) { bestKm = km; best = c; }
    }
    return best && bestKm < 60 ? `near ${best.name}` : "";
  }

  /* ---------- add to home screen ---------- */
  const installBtn = $("#installBtn");
  const framed = (() => { try { return window.top !== window.self; } catch (e) { return true; } })();
  const installed = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  const onPhone = matchMedia("(pointer: coarse)").matches;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  let installPrompt = null;
  function updateInstall() { installBtn.hidden = framed || installed() || !(onPhone || installPrompt); }
  window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installPrompt = e; updateInstall(); });
  window.addEventListener("appinstalled", () => { installPrompt = null; installBtn.hidden = true; closeSheet(); });
  updateInstall();
  const SHARE_IC = `<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg></span>`;
  const PLUS_IC = `<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8.5v7M8.5 12h7"/></svg></span>`;
  const MENU_IC = `<span class="ic"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5.5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="18.5" r="2"/></svg></span>`;
  installBtn.addEventListener("click", async () => {
    if (installPrompt) {
      const p = installPrompt;
      installPrompt = null;
      p.prompt();
      try { await p.userChoice; } catch (e) {}
      updateInstall();
      return;
    }
    $("#installIcon").innerHTML = crabSVG({ tier: "hot", rain: false, snow: false, sunny: true }, { flat: true });
    $("#installSteps").innerHTML = isIOS
      ? `<li><span>tap the share button ${SHARE_IC} in your browser's toolbar</span></li>
         <li><span>scroll down and tap ${PLUS_IC} <b>Add to Home Screen</b></span></li>
         <li><span>tap <b>Add</b>. the crab lands on your home screen</span></li>`
      : `<li><span>open your browser's menu ${MENU_IC}</span></li>
         <li><span>tap <b>Install app</b> or <b>Add to Home screen</b></span></li>
         <li><span>tap <b>Install</b>. the crab lands on your home screen</span></li>`;
    showSheet($("#installSheet"));
  });
  /* the offline-ready service worker lives next to index.html on the real site */
  if ("serviceWorker" in navigator && !framed && location.protocol === "https:") {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }

  /* widget sheet */
  $("#widgetBtn").addEventListener("click", () => {
    if (!state.city) return;
    const days = state.city.days;
    const ti = Math.max(0, days.findIndex((d) => d.date === state.today));
    const d = days[ti] || days[0];
    const xNow = currentData(state.city);
    const o = xNow ? dressForHour(xNow) : dressFor(d);
    const g = glowFor(o);
    const cat = crabSVG(o, { flat: true });
    $("#home").style.setProperty("--glow", g);
    $("#home").innerHTML = `
      <div class="w w-medium"><div class="wbox"><div class="wglow"></div><div class="wcat">${cat}</div><span class="wt l">${temp(d.min)}</span><span class="wt r">${temp(d.max)}</span></div><label>weathercrab</label></div>
      <div class="w w-small"><div class="wbox"><div class="wglow"></div><div class="wcat">${cat}</div><span class="wt l">${temp(d.min)}</span><span class="wt r">${temp(d.max)}</span></div><label>weathercrab</label></div>
      <div class="w-icons">
        <div class="w"><div class="app-icon">${crabSVG({ tier: "hot", rain: false, snow: false, sunny: true }, { flat: true })}</div><label>weathercrab</label></div>
        <div class="w"><div class="app-icon ghost"></div><label>&nbsp;</label></div>
        <div class="w"><div class="app-icon ghost"></div><label>&nbsp;</label></div>
        <div class="w"><div class="app-icon ghost"></div><label>&nbsp;</label></div>
      </div>`;
    $("#widgetNote").textContent = `${xNow ? "right now" : dayName(d.date, state.today)} in ${state.city.place || state.city.name}: ${wearText(o)}`;
    showSheet($("#widgetSheet"));
  });

  /* ---------- live data (works when the page may reach open-meteo) ---------- */
  async function getJSON(url, ms, signal) {
    const ac = new AbortController();
    const t = setTimeout(() => ac.abort(), ms);
    signal?.addEventListener("abort", () => ac.abort());
    try {
      const r = await fetch(url, { signal: ac.signal });
      if (!r.ok) throw new Error("http " + r.status);
      return await r.json();
    } finally { clearTimeout(t); }
  }
  async function loadLive(c) {
    try {
      const r = await getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&daily=weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min,wind_speed_10m_max,precipitation_probability_max&current=temperature_2m,apparent_temperature,weather_code,is_day,wind_speed_10m&hourly=weather_code,temperature_2m,apparent_temperature,wind_speed_10m,is_day&minutely_15=weather_code&past_minutely_15=1&forecast_minutely_15=32&past_days=1&forecast_days=14&timezone=auto&wind_speed_unit=ms`, 8000);
      const days = toDays(r.daily);
      if (!days.length) return null;
      const H = r.hourly || {};
      const t10 = (a) => (a ? a.map((v) => (v == null ? null : Math.round(v * 10))) : null);
      return {
        ...c, tz: r.timezone || c.tz, days, _slots: null, off: r.utc_offset_seconds || 0,
        h0: H.time?.[0], h: H.weather_code, ht: t10(H.temperature_2m), hf: t10(H.apparent_temperature),
        hw: H.wind_speed_10m ? H.wind_speed_10m.map((v) => (v == null ? null : Math.round(v))) : null, hd: H.is_day,
        m0: r.minutely_15?.time?.[0], m: r.minutely_15?.weather_code,
        cur: r.current && r.current.temperature_2m != null ? {
          t: r.current.temperature_2m, f: r.current.apparent_temperature ?? r.current.temperature_2m,
          code: r.current.weather_code ?? 3, day: !!r.current.is_day, wind: r.current.wind_speed_10m ?? 0, at: Date.now()
        } : null
      };
    } catch (e) { return null; }
  }

  /* the clock in the phone frame on computers */
  const sbTime = $("#sbTime");
  const tickFrame = () => { const t = new Date(); sbTime.textContent = `${t.getHours() % 12 || 12}:${String(t.getMinutes()).padStart(2, "0")}`; };
  tickFrame();
  setInterval(tickFrame, 15000);
  setInterval(() => {
    if (document.hidden || !state.city) return;
    const n = cityNow(state.city);
    if (n.date + n.hour !== state.nowKey) {
      if (state.followNow) {
        state.hour = n.hour;
        const ti = state.city.days.findIndex((d) => d.date === n.date);
        if (ti >= 0) state.idx = ti;
      }
      state.today = n.date;
      renderStrip(false);
    }
    render();
  }, 15000);
  setInterval(async () => {
    if (!state.live || document.hidden || openSheet || !state.city) return;
    const live = await loadLive(state.city);
    if (!live) return;
    setCity(live, true);
  }, 15 * 6e4);

  /* ---------- boot ---------- */
  renderUnit();
  const want = saved.city;
  const nyc = snapCities.find((c) => c.g === "big" && c.name === "new york") || snapCities[0];
  const first = (want && snapCities.find((c) => c.full === want.full)) || nyc;
  const openOnMe = !framed && (!want || want.loc);
  const kmApart = (a, b) => Math.hypot((a.lat - b.lat) * 111, (a.lon - b.lon) * 111 * Math.cos((a.lat * Math.PI) / 180));
  const last = loadLast();
  if (last && last.days.some((d) => d.date === todayIn(last.tz)) && (openOnMe ? last.loc : last.full === want?.full)) setCity(last);
  else if (first.h0 && !openOnMe) setCity(first);
  else if (framed) setCity(first);
  else showLoading();
  (async () => {
    /* a city they picked themselves */
    if (!openOnMe) {
      const live = await loadLive(want && want.lat != null ? want : first);
      if (live) { state.live = true; setCity(live, true); } else { state.live = false; if (!state.city) setCity(first); renderNote(); }
      return;
    }
    /* their own location: show the quick answer right away, then sharpen it once the browser gives a precise spot */
    let settled = null;
    const fromSpot = async (spot) => {
      const c = { name: "my location", full: "current location", sub: "", lat: +spot.lat.toFixed(2), lon: +spot.lon.toFixed(2), loc: true };
      const [live, place] = await Promise.all([loadLive(c), spot.place ? spot.place : placeName(spot.lat, spot.lon)]);
      if (live) live.place = place;
      return live;
    };
    const quickSpot = want?.loc && want.lat != null ? { lat: want.lat, lon: want.lon, place: want.place } : await roughSpot();
    if (quickSpot) {
      const live = await fromSpot(quickSpot);
      if (live) { settled = quickSpot; state.live = true; setCity(live, true); }
    }
    const spot = await preciseSpot();
    if (spot && (!settled || kmApart(spot, settled) > 8)) {
      const live = await fromSpot(spot);
      if (live) { settled = spot; state.live = true; setCity(live, true); }
    }
    if (!settled) {
      const live = await loadLive(first);
      if (live) { state.live = true; setCity(live); } else { state.live = false; setCity(first); }
    }
  })();
})();
</script>
