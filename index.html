<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A little crab checks the forecast and dresses in the right layers for the weather.">
<meta name="theme-color" content="#1b1918">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="weathercrab">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta property="og:title" content="weathercrab">
<meta property="og:description" content="A little crab checks the forecast and dresses in the right layers for the weather.">
<meta property="og:type" content="website">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<style>
html { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
</style>
<title>weathercrab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap">
<style>
/* layout: one phone-width column — header, the crab on a soft weather glow, a swipeable day strip, one pill button.
   single dark theme on purpose: a night-time marker sketch, with the weather glowing behind the crab. */
:root {
  color-scheme: dark;
  --bg: #1b1918;
  --ink: #efe9e1;
  --muted: #a8a097;
  --faint: #6f6861;
  --chip: #2c2927;
  --chip-hover: #37332f;
  --sheet: #232120;
  --line: #3a3633;
  --scrim: rgba(0, 0, 0, .5);
  --wall-a: #4d5b45;
  --wall-b: #39442f;
  --widget: #262321;
  --focus: #8fb3d9;
  --glow-o: .55;
  --font: "Comic Neue", "Comic Sans MS", "Chalkboard SE", "Comic Sans", cursive;
  --day-h: 186px;
  --rain: #8fc0ea;
}
[hidden] { display: none !important; }
@property --glow { syntax: "<color>"; inherits: true; initial-value: #cfe0ef; }

html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 10px; }

.app {
  position: relative;
  height: 100%;
  min-height: 560px;
  max-height: 960px;
  max-width: 430px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 12px 18px;
  display: flex;
  flex-direction: column;
  box-sizing: border-box;
}

/* header */
.top { display: grid; grid-template-columns: 76px 1fr 76px; align-items: center; height: 40px; }
.round {
  width: 32px; height: 32px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--chip); color: var(--muted);
  font-size: 13px; font-weight: 700;
  transition: background-color .2s;
}
.round:hover { background: var(--chip-hover); }
.round svg { width: 15px; height: 15px; }
.units { justify-self: end; display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--chip); }
.units button { font-size: 12px; font-weight: 700; line-height: 1; color: var(--muted); padding: 6px 8px; border-radius: 999px; transition: background-color .2s, color .2s; }
.units button:hover { color: var(--ink); }
.units button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.city {
  justify-self: center;
  display: inline-flex; align-items: center; gap: 5px;
  font-weight: 700; font-size: 17px; color: var(--muted);
  padding: 6px 10px; border-radius: 12px;
  max-width: 100%; min-width: 0;
}
.city span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.city .pin { width: 11px; height: 11px; flex: none; }
.city .chev { width: 11px; height: 11px; flex: none; }
.city:hover { color: var(--ink); }

/* stage */
.main {
  position: relative; flex: 1; min-height: 0;
  --cat-h: clamp(210px, 42vh, 360px);
  --stack-h: calc(var(--cat-h) + var(--day-h) + 60px);
  --y0: max(0px, calc(46% - var(--stack-h) / 2));
}
.cat-layer {
  position: absolute; left: 0; right: 0; top: var(--y0); height: var(--cat-h);
  display: grid; place-items: center;
  pointer-events: none;
}
.glow {
  position: absolute; left: 50%; top: 50%;
  width: min(92%, var(--cat-h)); aspect-ratio: 1;
  translate: -50% -50%;
  border-radius: 50%;
  background: radial-gradient(closest-side, var(--glow) 0%, var(--glow) 42%, color-mix(in srgb, var(--glow) 0%, transparent) 100%);
  filter: blur(6px);
  transition: --glow .8s ease;
}
.fx {
  position: absolute; left: 50%; top: 50%;
  width: min(92%, var(--cat-h)); aspect-ratio: 1;
  translate: -50% -50%;
  -webkit-mask-image: radial-gradient(closest-side, #000 45%, transparent 95%);
  mask-image: radial-gradient(closest-side, #000 45%, transparent 95%);
}
.cat-stack { position: relative; height: calc(var(--cat-h) * .58); aspect-ratio: 240 / 200; max-width: 100%; }
.holder { position: absolute; inset: 0; opacity: 0; transform: translateY(6px) scale(.97); transition: opacity .38s ease, transform .38s ease; }
.holder.on { opacity: 1; transform: none; }
.holder svg { width: 100%; height: 100%; display: block; overflow: visible; }

/* crab idle motion */
.crab .eyes { transform-box: fill-box; transform-origin: center; animation: blink 5.5s infinite; }
.crab .breathe { transform-box: view-box; transform-origin: 120px 195px; animation: breathe 3.4s ease-in-out infinite; }
@keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.12); } }
@keyframes breathe { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.02); } }

/* how the crab moves depends on the weather (data-move on the svg) */
.crab .move, .crab .gust, .crab .umb, .crab .leg, .crab .sweat { transform-box: view-box; }
.crab .move, .crab .gust { transform-origin: 120px 195px; }
.crab .umb { transform-origin: 214px 130px; }
.crab .sweat { opacity: 0; }
.crab[data-move="shiver"] .move { animation: shiver 2.6s linear infinite; }
.crab[data-move="brr"] .move { animation: brr 4.2s linear infinite; }
.crab[data-move="sway"] .move { animation: sway 3.4s ease-in-out infinite alternate; }
.crab[data-move="scuttle"] .move { animation: scuttle 4.8s ease-in-out infinite; }
.crab[data-move="scuttle"] .leg { animation: step .32s ease-in-out infinite alternate; }
.crab[data-move="scuttle"] .l1, .crab[data-move="scuttle"] .l3 { animation-delay: -.16s; }
.crab[data-move="hop"] .move { animation: hop 1.9s ease-in-out infinite; }
.crab[data-move="bounce"] .move { animation: bounce 1.3s ease-in-out infinite; }
.crab[data-move="melt"] .move { animation: melt 2.8s ease-in-out infinite alternate; }
.crab[data-move="melt"] .sweat { animation: drip 2.8s ease-in infinite; }
.crab[data-move="rain"] .move { animation: bounce 2.4s ease-in-out infinite; }
.crab[data-move="rain"] .umb { animation: wobble 2.6s ease-in-out infinite alternate; }
.crab.windy .gust { animation: gust 3.2s ease-in-out infinite; }
.crab.windy .umb { animation: wobble-hard 1.1s ease-in-out infinite alternate; }
@keyframes shiver { 0%, 52%, 70%, 100% { transform: none; } 54%, 58% { transform: translateX(-1.8px); } 56%, 60% { transform: translateX(1.8px); } 62% { transform: translateX(-1.4px); } 64% { transform: translateX(1.4px); } 66% { transform: translateX(-1px); } 68% { transform: translateX(1px); } }
@keyframes brr { 0%, 76%, 86%, 100% { transform: none; } 78%, 82% { transform: translateX(-1.2px); } 80%, 84% { transform: translateX(1.2px); } }
@keyframes sway { from { transform: rotate(-2.5deg); } to { transform: rotate(2.5deg); } }
@keyframes scuttle { 0%, 100% { transform: translateX(-10px); } 50% { transform: translateX(10px); } }
@keyframes step { from { transform: translateY(0); } to { transform: translateY(-3.5px); } }
@keyframes hop { 0%, 55%, 100% { transform: translateY(0) scale(1, 1); } 8% { transform: translateY(0) scale(1.04, .93); } 22% { transform: translateY(-14px) scale(.97, 1.05); } 36% { transform: translateY(0) scale(1.05, .93); } 46% { transform: translateY(0) scale(1, 1); } }
@keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
@keyframes melt { from { transform: scale(1, 1); } to { transform: scale(1.035, .955); } }
@keyframes drip { 0%, 30% { opacity: 0; transform: translateY(-2px); } 40% { opacity: 1; transform: translateY(0); } 85% { opacity: 1; transform: translateY(16px); } 100% { opacity: 0; transform: translateY(20px); } }
@keyframes wobble { from { transform: rotate(-2.5deg); } to { transform: rotate(2.5deg); } }
@keyframes wobble-hard { from { transform: rotate(-5deg); } to { transform: rotate(4deg); } }
@keyframes gust { 0%, 100% { transform: rotate(-1.5deg); } 30% { transform: rotate(-5deg); } 45% { transform: rotate(-2.5deg); } 70% { transform: rotate(-6deg); } }


/* swipeable days */
.track {
  position: absolute; inset: 0;
  display: flex;
  overflow-x: auto; overflow-y: hidden;
  scroll-snap-type: x mandatory;
  scrollbar-width: none;
  overscroll-behavior-x: contain;
}
.track::-webkit-scrollbar { display: none; }
.slide {
  position: relative;
  flex: 0 0 100%;
  scroll-snap-align: center;
  scroll-snap-stop: always;
}
.day {
  position: absolute; left: 0; right: 0;
  top: calc(var(--y0) + var(--cat-h));
  height: var(--day-h);
  display: flex; flex-direction: column; align-items: center;
  text-align: center;
}
.day-name { font-weight: 700; font-size: 20px; line-height: 26px; }
.day-date { font-size: 12px; line-height: 16px; color: var(--muted); margin-top: 2px; }
.temps {
  height: 64px; margin-top: 8px;
  display: flex; align-items: baseline; justify-content: center; gap: 6px;
  font-weight: 700; font-variant-numeric: tabular-nums;
}
.hi { font-size: 54px; line-height: 64px; letter-spacing: -.01em; }
.sep { font-size: 26px; color: var(--faint); font-weight: 400; }
.lo { font-size: 32px; color: var(--muted); }
.cond { font-size: 14px; line-height: 20px; color: var(--muted); margin-top: 4px; }
.rainline { display: inline-flex; align-items: center; gap: 5px; max-width: calc(100% - 64px); font-size: 12px; line-height: 18px; color: var(--rain); margin-top: 2px; white-space: nowrap; }
.rainline span { overflow: hidden; text-overflow: ellipsis; }
.rainline svg { width: 11px; height: 11px; flex: none; }
.wind { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; line-height: 18px; color: var(--faint); margin-top: 2px; }
.wind svg { width: 12px; height: 12px; }

.nav {
  position: absolute; top: calc(var(--y0) + var(--cat-h) + 68px);
  width: 28px; height: 36px;
  display: grid; place-items: center;
  color: var(--faint);
  z-index: 2;
  transition: opacity .2s, color .2s;
}
.nav:hover { color: var(--muted); }
.nav svg { width: 14px; height: 14px; }
.nav[disabled] { opacity: 0; pointer-events: none; }
#prevBtn { left: -10px; }
#nextBtn { right: -10px; }

.more { position: absolute; left: 50%; translate: -50% 0; top: calc(var(--y0) + var(--cat-h) + var(--day-h) + 12px); z-index: 2; white-space: nowrap; }
.foot { display: flex; justify-content: center; padding-top: 6px; }
.pill {
  background: var(--chip); color: var(--muted);
  font-weight: 700; font-size: 13px;
  padding: 10px 22px; border-radius: 999px;
  transition: background-color .2s, color .2s;
}
.pill:hover { background: var(--chip-hover); color: var(--ink); }
.note { font-size: 11px; color: var(--faint); margin: 0; min-height: 15px; text-align: center; }
.note a { color: inherit; }

/* sheets */
.sheet-wrap { position: fixed; inset: 0; z-index: 10; display: flex; align-items: flex-end; justify-content: center; }
.backdrop { position: absolute; inset: 0; background: var(--scrim); opacity: 0; transition: opacity .25s ease; }
.sheet {
  position: relative;
  width: 100%; max-width: 430px; max-height: 82%;
  box-sizing: border-box;
  background: var(--sheet);
  border-radius: 26px 26px 0 0;
  padding-inline: 18px;
  padding-block: 14px calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 12px;
  transform: translateY(104%);
  transition: transform .32s cubic-bezier(.2, .8, .2, 1);
  box-shadow: 0 -8px 30px rgba(0, 0, 0, .45);
}
.sheet-wrap.open .backdrop { opacity: 1; }
.sheet-wrap.open .sheet { transform: none; }
.grab { width: 38px; height: 4px; border-radius: 4px; background: var(--line); align-self: center; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; }
.sheet-head h2 { margin: 0; font-size: 18px; font-weight: 700; }
.list { list-style: none; margin: 0; padding: 0; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; }
.list li:not(.sec) + li:not(.sec) { border-top: 1px dashed var(--line); }
.list .sec { position: sticky; top: 0; z-index: 1; background: var(--sheet); font-size: 12px; font-weight: 700; color: var(--faint); letter-spacing: .06em; padding: 12px 6px 4px; }
#citySheet .sheet { height: 82%; }
.row {
  width: 100%; text-align: left;
  display: grid; align-items: center; gap: 12px;
  padding: 8px 6px; border-radius: 12px;
}
.row:hover { background: var(--chip); }
.row.sel { background: var(--chip); }
.date-row { grid-template-columns: 44px 1fr auto; }
.date-row .mini { width: 44px; height: 37px; }
.date-row .mini svg { width: 100%; height: 100%; display: block; }
.row b { font-size: 15px; display: block; }
.row small { font-size: 12px; color: var(--muted); }
.row .t { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 15px; white-space: nowrap; }
.row .t span { color: var(--muted); font-size: 13px; }
.city-row { grid-template-columns: 1fr auto; }
.city-row small { display: block; }
.city-row .t { font-size: 14px; color: var(--muted); font-weight: 400; }
.search {
  display: flex; align-items: center; gap: 8px;
  background: var(--chip); border-radius: 14px;
  padding: 10px 12px; color: var(--muted);
}
.search svg { width: 15px; height: 15px; flex: none; }
.search input { border: 0; background: transparent; font: inherit; font-size: 16px; color: var(--ink); width: 100%; min-width: 0; outline: none; }
.search input::placeholder { color: var(--faint); }
.loc-btn { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-weight: 700; font-size: 14px; padding: 4px 6px; align-self: flex-start; }
.loc-btn svg { width: 12px; height: 12px; }
.sheet-note { font-size: 12px; color: var(--muted); margin: 0; text-align: center; }

/* widget preview */
.home {
  border-radius: 22px;
  background: linear-gradient(170deg, var(--wall-a), var(--wall-b));
  padding: 18px 16px 16px;
  display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px;
}
.w { display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 0; }
.w label { font-size: 11px; color: #f4f1ea; font-weight: 700; }
.w-medium { grid-column: 1 / -1; }
.wbox {
  position: relative; width: 100%;
  background: var(--widget); border-radius: 20px;
  overflow: hidden;
  display: grid; place-items: center;
}
.w-medium .wbox { aspect-ratio: 2.15 / 1; }
.w-small .wbox { aspect-ratio: 1; }
.wbox .wglow { position: absolute; left: 50%; top: 46%; width: 62%; aspect-ratio: 1; translate: -50% -50%; border-radius: 50%; background: radial-gradient(closest-side, var(--glow) 0%, var(--glow) 40%, color-mix(in srgb, var(--glow) 0%, transparent) 100%); }
.w-medium .wbox .wglow { width: 34%; }
.wbox .wcat { position: relative; height: 56%; aspect-ratio: 240 / 200; margin-top: -8%; }
.wbox .wcat svg { width: 100%; height: 100%; display: block; }
.wbox .wt { position: absolute; bottom: 9px; font-size: 11px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.wbox .wt.l { left: 13px; } .wbox .wt.r { right: 13px; color: var(--ink); }
.w-icons { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-content: start; }
.app-icon { width: 100%; max-width: 64px; aspect-ratio: 1; border-radius: 15px; background: var(--widget); display: grid; place-items: center; overflow: hidden; position: relative; }
.app-icon svg { width: 90%; height: 90%; margin-top: 6%; }
.ghost { background: rgba(255, 255, 255, .1); }

.glow, .wbox .wglow { opacity: var(--glow-o); }

@media (max-height: 640px) { .hi { font-size: 46px; } }
@media (prefers-reduced-motion: reduce) {
  .crab * { animation: none !important; }
  .holder, .sheet, .backdrop, .glow { transition: none; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="wob" filterUnits="userSpaceOnUse" x="-40" y="-50" width="320" height="300">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="1" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="swim" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#f4efe6"/>
      <rect y="5" width="10" height="5" fill="#2f4a6d"/>
    </pattern>
    <pattern id="knit" patternUnits="userSpaceOnUse" width="12" height="12">
      <rect width="12" height="12" fill="#62907a"/>
      <rect y="7" width="12" height="5" fill="#486e5c"/>
    </pattern>
  </defs>
</svg>

<main class="app" id="app">
  <header class="top">
    <button class="round" id="widgetBtn" aria-label="widget preview" title="widget preview">
      <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="1" y="1" width="6" height="6" rx="1.8"/><rect x="9" y="1" width="6" height="6" rx="1.8"/><rect x="1" y="9" width="6" height="6" rx="1.8"/><rect x="9" y="9" width="6" height="6" rx="1.8"/></svg>
    </button>
    <button class="city" id="cityBtn" aria-haspopup="dialog">
      <svg class="pin" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 3 3 10.5l7.6 2.9L13.5 21z"/></svg>
      <span id="cityName">new york</span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div class="units" role="group" aria-label="temperature unit">
      <button id="unitF" aria-pressed="true" aria-label="fahrenheit">°f</button>
      <button id="unitC" aria-pressed="false" aria-label="celsius">°c</button>
    </div>
  </header>

  <section class="main" aria-label="forecast">
    <div class="cat-layer" aria-hidden="true">
      <div class="glow" id="glow"></div>
      <canvas class="fx" id="fx"></canvas>
      <div class="cat-stack">
        <div class="holder on" id="holderA"></div>
        <div class="holder" id="holderB"></div>
      </div>
    </div>
    <div class="track" id="track" tabindex="0" aria-roledescription="carousel" aria-label="days"></div>
    <button class="nav" id="prevBtn" aria-label="previous day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></button>
    <button class="pill more" id="moreBtn" aria-haspopup="dialog">view more dates</button>
    <button class="nav" id="nextBtn" aria-label="next day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button>
  </section>

  <footer class="foot">
    <p class="note" id="note"></p>
  </footer>
  <p id="live" class="note" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)"></p>
</main>

<div class="sheet-wrap" id="datesSheet" hidden>
  <div class="backdrop" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="datesTitle">
    <div class="grab"></div>
    <div class="sheet-head"><h2 id="datesTitle">this week</h2><button class="round" data-close aria-label="close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <ul class="list" id="dateList"></ul>
  </div>
</div>

<div class="sheet-wrap" id="citySheet" hidden>
  <div class="backdrop" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="cityTitle">
    <div class="grab"></div>
    <div class="sheet-head"><h2 id="cityTitle">pick a city</h2><button class="round" data-close aria-label="close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <label class="search" for="citySearch">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="citySearch" type="search" placeholder="search cities" autocomplete="off" spellcheck="false">
    </label>

  const sig = (o) => `${o.tier}|${o.rain}|${o.snow}|${o.sunny && (o.tier === "tee" || o.tier === "hot")}|${o.move}|${o.windy}`;

  /* ---------- dates ---------- */
  const MONTHS = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"];
  const WEEK = ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"];
  const fmtCache = {};

    if (d === -1) return "yesterday";
    if (d === 0) return "today";
    if (d === 1) return "tomorrow";

  /* ---------- state ---------- */
  const state = {
    unit: saved.unit === "c" ? "c" : "f",
    city: null,
    idx: 0,
    today: "",
    live: false,
    target: null,
    shownSig: "",
    activeHolder: $("#holderA")
  };
  const temp = (c) => Math.round(state.unit === "f" ? c * 9 / 5 + 32 : c) + "°";

  const track = $("#track"), prevBtn = $("#prevBtn"), nextBtn = $("#nextBtn");

  function setCity(city, keepDate) {

    state.city = city;
    state.today = todayIn(city.tz);

    if (i < 0) i = city.days.findIndex((d) => d.date === state.today);

  function renderSlides() {

  /* ---------- rain timing: 15-minute slots for the next few hours, hourly after that ---------- */
  const isWet = (c) => c != null && (isRain(c) || isSnow(c));
  const localMs = (iso, off) => Date.parse(iso.length === 13 ? iso + ":00:00Z" : iso + ":00Z") - (off || 0) * 1000;
  function slotsOf(city) {
    if (city._slots) return city._slots;
    const out = [];
    let mS = Infinity, mE = -Infinity;
    if (city.m && city.m.length && city.m0) {
      mS = localMs(city.m0, city.off);

  function clock(ms, off, round) {

    let j = k;

  /* one short line about when it rains (or snows) on day d; "" when there's nothing to say */

    const sl = slotsOf(city);
    if (!sl.length) return "";
    const off = city.off || 0, now = Date.now();
    const dayStart = localMs(d.date + "T00:00", off), dayEnd = dayStart + 864e5;

      if (i >= 0) {
        if (isWet(sl[i].c)) {
          const sp = spellFrom(sl, i);
          return `${CODES[sl[i].c]} for the next ${fmtDur(sp.e - now)}`;
        }
        const k = sl.findIndex((x, n) => n > i && isWet(x.c));
        if (k >= 0 && sl[k].s - now <= 3 * 36e5) return `${CODES[sl[k].c]} starting in ${fmtDur(sl[k].s - now)}`;
        if (k >= 0 && sl[k].s < dayEnd) { const sp = spellFrom(sl, k); return span(CODES[sp.c], sp.s, Math.min(sp.e, dayEnd), off); }
        const earlier = sl.filter((x) => x.e <= now && x.e > dayStart && isWet(x.c));
        if (earlier.length) return `dry now · ${CODES[worst(earlier.map((x) => x.c))]} earlier`;
      }

    }
    if (!isWet(d.code)) return "";
    const wet = sl.filter((x) => x.s < dayEnd && x.e > dayStart && isWet(x.c));
    if (!wet.length) return "";
    const spells = [];
    for (const x of wet) {
      const last = spells[spells.length - 1];
      if (last && x.s <= last.e) { last.e = x.e; last.c.push(x.c); } else spells.push({ s: x.s, e: x.e, c: [x.c] });

    const hrs = Math.max(1, Math.round(total / 36e5));
    const name = CODES[worst(wet.map((x) => x.c))];
    if (hrs >= 20) return `${name} most of the day`;
    if (spells.length === 1) return span(name, Math.max(spells[0].s, dayStart), Math.min(spells[0].e, dayEnd), off);
    return `${name} on and off, about ${hrs} hour${hrs > 1 ? "s" : ""} in all`;
  }
  function renderRainLines() {
    if (!state.city) return;

  function jump(i) {

    nextBtn.disabled = i === days.length - 1;
    $("#live").textContent = `${dayName(d.date, state.today)}: high ${temp(d.max)}, low ${temp(d.min)}, ${CODES[d.code] || ""}. the crab is wearing ${wearText(o)} and ${MOVE_TEXT[o.move]}${o.windy ? ", leaning into the wind" : ""}.${rainLine(state.city, d) ? " " + rainLine(state.city, d) + "." : ""}`;
  }

  let scrollRaf = 0;

  nextBtn.addEventListener("click", () => go(state.idx + 1));

    if (e.target.closest && e.target.closest("input")) return;

  /* unit switch: both units always visible, the one in use is filled in */

  unitC.addEventListener("click", () => setUnit("c"));

  function renderNote() {
    const note = $("#note");
    if (state.live) note.innerHTML = `live forecast · <a href="https://open-meteo.com" target="_blank" rel="noopener">open-meteo</a>`;
    else note.innerHTML = `forecast saved ${shortDate(SNAP.fetched)} · <a href="https://open-meteo.com" target="_blank" rel="noopener">open-meteo</a>`;
  }

  /* ---------- rain, snow & wind ---------- */
  const fx = { cv: $("#fx"), ctx: null, mode: null, key: "", windy: false, parts: [], raf: 0, last: 0, w: 0, h: 0 };
  fx.ctx = fx.cv.getContext("2d");
  function sizeFx() {
    const r = fx.cv.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
    fx.w = r.width; fx.h = r.height;
    fx.cv.width = Math.round(r.width * dpr); fx.cv.height = Math.round(r.height * dpr);
    fx.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  const slantNow = () => (fx.windy ? .45 : .1);
  function spawn(p, initial) {
    if (fx.mode === "heat") {
      p.x = fx.w * (.12 + Math.random() * .76);
      p.y = initial ? Math.random() * fx.h : fx.h + 10;
      p.v = 18 + Math.random() * 16; p.len = 22 + Math.random() * 16; p.ph = Math.random() * 6.28;
      return p;
    }
    if (fx.mode === "wind") {
      p.x = initial ? Math.random() * fx.w : -20 - Math.random() * 80;
      p.y = fx.h * (.15 + Math.random() * .7);
      p.v = 170 + Math.random() * 120; p.len = 18 + Math.random() * 26; p.ph = Math.random() * 6.28;
      return p;
    }

    p.x = Math.random() * (fx.w + fx.h * sl) - fx.h * sl;
    p.y = initial ? Math.random() * fx.h : -12;

    return p;
  }
  function setFx(mode, windy) {
    if (reduced) mode = null;
    const key = mode + "|" + !!windy;
    if (key === fx.key) return;
    fx.key = key; fx.mode = mode; fx.windy = !!windy;
    if (!fx.w) sizeFx();
    const n = mode === "rain" ? 34 : mode === "snow" ? 40 : mode === "wind" ? 9 : mode === "heat" ? 12 : 0;
    fx.parts = Array.from({ length: n }, () => spawn({}, true));
    if (mode && !fx.raf) { fx.last = performance.now(); fx.raf = requestAnimationFrame(tick); }
    if (!mode) fx.ctx.clearRect(0, 0, fx.w, fx.h);
  }
  function tick(now) {
    const dt = Math.min(.05, (now - fx.last) / 1000); fx.last = now;
    const c = fx.ctx; c.clearRect(0, 0, fx.w, fx.h);
    if (!fx.mode) { fx.raf = 0; return; }
    const sl = slantNow();
    if (fx.mode === "rain") {
      c.strokeStyle = "rgba(160,195,230,.55)"; c.lineWidth = 1.5; c.lineCap = "round"; c.beginPath();
      for (const p of fx.parts) { p.y += p.v * dt; p.x += p.v * dt * sl; if (p.y > fx.h + 10) spawn(p); c.moveTo(p.x, p.y); c.lineTo(p.x - p.len * sl, p.y - p.len); }
      c.stroke();
    } else if (fx.mode === "snow") {
      c.fillStyle = "rgba(240,245,255,.9)";
      for (const p of fx.parts) {
        p.y += p.v * dt; p.ph += dt * 1.4; p.x += (fx.windy ? 45 : 0) * dt;
        const x = p.x + Math.sin(p.ph) * 6;
        if (p.y > fx.h + 8 || x > fx.w + 10) spawn(p);
        c.beginPath(); c.arc(x, p.y, p.r, 0, 6.283); c.fill();
      }
    } else if (fx.mode === "heat") {
      c.strokeStyle = "rgba(255,190,140,.22)"; c.lineWidth = 1.6; c.lineCap = "round";
      for (const p of fx.parts) {
        p.y -= p.v * dt; p.ph += dt * 2.4;
        if (p.y + p.len < -10) spawn(p);
        c.beginPath();
        for (let k = 0; k <= 6; k++) { const yy = p.y - (p.len * k) / 6, xx = p.x + Math.sin(p.ph + k * .9) * 3; k ? c.lineTo(xx, yy) : c.moveTo(xx, yy); }
        c.stroke();
      }
    } else {
      c.strokeStyle = "rgba(225,230,240,.3)"; c.lineWidth = 1.6; c.lineCap = "round";
      for (const p of fx.parts) {
        p.x += p.v * dt; p.ph += dt * 3;
        if (p.x - p.len > fx.w + 10) spawn(p);
        const y = p.y + Math.sin(p.ph) * 3;
        c.beginPath(); c.moveTo(p.x - p.len, y); c.quadraticCurveTo(p.x - p.len / 2, y - 3, p.x, y); c.stroke();
      }
    }
    fx.raf = requestAnimationFrame(tick);
  }
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && fx.raf) { cancelAnimationFrame(fx.raf); fx.raf = 0; }
    else if (!document.hidden && fx.mode && !fx.raf) { fx.last = performance.now(); fx.raf = requestAnimationFrame(tick); }
  });

  /* ---------- sheets ---------- */
  let openSheet = null, returnFocus = null;
  function showSheet(el, focusSel) {
    returnFocus = document.activeElement;
    el.hidden = false;
    openSheet = el;
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("open")));
    setTimeout(() => (el.querySelector(focusSel) || el.querySelector("[data-close].round"))?.focus({ preventScroll: true }), reduced ? 0 : 60);
  }
  function closeSheet() {
    const el = openSheet; if (!el) return;
    openSheet = null;
    el.classList.remove("open");
    setTimeout(() => { el.hidden = true; }, reduced ? 0 : 320);
    returnFocus?.focus?.({ preventScroll: true });
  }
  document.querySelectorAll(".sheet-wrap").forEach((w) => w.addEventListener("click", (e) => { if (e.target.closest("[data-close]")) closeSheet(); }));

  /* dates sheet */
  $("#moreBtn").addEventListener("click", () => {
    const days = state.city.days;
    $("#dateList").innerHTML = days.map((d, i) => {
      const o = dressFor(d);
      return `<li><button class="row date-row${i === state.idx ? " sel" : ""}" data-i="${i}" ${i === state.idx ? 'aria-current="true"' : ""}>
        <span class="mini">${crabSVG(o, { flat: true })}</span>
        <span><b>${dayName(d.date, state.today)}</b><small>${shortDate(d.date)} · ${CODES[d.code] || ""}</small></span>
        <span class="t">${temp(d.max)} <span>/ ${temp(d.min)}</span></span>
      </button></li>`;
    }).join("");
    showSheet($("#datesSheet"), ".row.sel");
  });
  $("#dateList").addEventListener("click", (e) => {
    const b = e.target.closest("[data-i]"); if (!b) return;
    const i = +b.dataset.i;
    closeSheet();
    setTimeout(() => go(i), reduced ? 0 : 200);
  });

  /* city sheet */
  const cityList = $("#cityList"), cityMsg = $("#cityMsg"), citySearch = $("#citySearch");
  const esc = (s) => String(s).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  const GROUPS = [["cap", "state capitals"], ["big", "biggest cities"], ["ca", "more california"], ["fl", "more florida"], ["ny", "more new york"], ["tx", "more texas"], ["world", "around the world"]];
  function subText(c) {
    if (c.sub != null) return c.sub;
    if (c.g === "cap") return c.abbr === "DC" ? "us capital" : `${c.st.toLowerCase()} · state capital`;
    return (c.st || "").toLowerCase();
  }
  function cityRow(c, key) {
    let t = "";
    if (!state.live && c.days) {
      const d = c.days.find((x) => x.date === todayIn(c.tz)) || c.days[1];
      if (d) t = `${temp(d.max)} / ${temp(d.min)}`;
    }
    const sel = state.city && c.full === state.city.full;
    return `<li><button class="row city-row${sel ? " sel" : ""}" data-key="${key}"${sel ? ' aria-current="true"' : ""}>
      <span><b>${esc(c.name)}</b><small>${esc(subText(c))}</small></span>
      <span class="t">${t}</span></button></li>`;
  }
  function savedHits(q) {
    const ql = q.trim().toLowerCase();
    const all = snapCities.map((c, i) => i);
    if (!ql) return all;
    return all.filter((i) => {
      const c = snapCities[i];
      return c.name.includes(ql) || c.st.toLowerCase().includes(ql) || (ql.length === 2 && c.abbr.toLowerCase() === ql);
    });
  }
  function savedHTML(hits) {
    let html = "";
    for (const [g, label] of GROUPS) {
      const rows = hits.filter((i) => snapCities[i].g === g);
      if (rows.length) html += `<li class="sec" role="presentation">${label}</li>` + rows.map((i) => cityRow(snapCities[i], "s" + i)).join("");
    }
    return html;
  }
  let searchResults = [], searchT = 0, searchAbort = null;
  function renderCityList() {
    const q = citySearch.value;
    const hits = savedHits(q);
    cityList.innerHTML = savedHTML(hits);
    cityList.scrollTop = 0;
    searchResults = [];
    clearTimeout(searchT);
    searchAbort?.abort();
    if (!state.live) {
      cityMsg.textContent = hits.length ? (q.trim() ? "" : `${snapCities.length} places saved with this week's forecast`) : "nothing saved matches that. try a state name or a code like tx.";
      return;
    }
    cityMsg.textContent = "";
    if (q.trim().length < 2) return;
    searchT = setTimeout(async () => {
      searchAbort = new AbortController();
      cityMsg.textContent = "searching…";
      try {
        const r = await getJSON(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q.trim())}&count=8&language=en&format=json`, 6000, searchAbort.signal);
        const near = (a, b) => Math.abs(a.lat - b.lat) < .25 && Math.abs(a.lon - b.lon) < .25;
        searchResults = (r.results || []).map((x) => ({
          name: String(x.name).toLowerCase(),
          full: [x.name, x.admin1, x.country].filter(Boolean).join(", "),
          sub: [x.admin1, x.country].filter(Boolean).join(", ").toLowerCase(),
          lat: x.latitude, lon: x.longitude, tz: x.timezone
        })).filter((x) => !hits.some((i) => near(snapCities[i], x)));
        if (searchResults.length) cityList.insertAdjacentHTML("beforeend", `<li class="sec" role="presentation">more places</li>` + searchResults.map((c, i) => cityRow(c, "r" + i)).join(""));
        cityMsg.textContent = hits.length || searchResults.length ? "" : `no place called “${q.trim()}”. check the spelling and try again.`;
      } catch (e) {
        if (e.name !== "AbortError") cityMsg.textContent = "search isn't reachable right now. pick a saved place.";
      }
    }, 280);
  }
  citySearch.addEventListener("input", renderCityList);
  cityList.addEventListener("click", async (e) => {
    const b = e.target.closest("[data-key]"); if (!b) return;
    const k = b.dataset.key;
    const c = k[0] === "s" ? snapCities[+k.slice(1)] : searchResults[+k.slice(1)];
    if (!c) return;
    if (state.live) {
      cityMsg.textContent = "getting the forecast…";
      const live = await loadLive(c);
      if (live) { closeSheet(); setCity(live); return; }
      if (!c.days) { cityMsg.textContent = "couldn't reach the forecast. try again in a moment."; return; }
    }
    closeSheet();
    setCity(c);
  });
  $("#cityBtn").addEventListener("click", () => {
    citySearch.value = "";
    $("#locBtn").hidden = !(state.live && "geolocation" in navigator);
    citySearch.placeholder = state.live ? "search any city" : "search a city or state";
    renderCityList();
    showSheet($("#citySheet"), "#citySearch");
    requestAnimationFrame(() => { const sel = cityList.querySelector(".sel"); if (sel) cityList.scrollTop = Math.max(0, sel.offsetTop - cityList.clientHeight / 2); });
  });
  $("#locBtn").addEventListener("click", () => {
    cityMsg.textContent = "finding you…";
    navigator.geolocation.getCurrentPosition(async (pos) => {
      const c = { name: "my location", full: "current location", sub: "", lat: +pos.coords.latitude.toFixed(2), lon: +pos.coords.longitude.toFixed(2) };
      const live = await loadLive(c);
      if (live) { closeSheet(); setCity(live); } else cityMsg.textContent = "couldn't reach the forecast. try again in a moment.";
    }, () => { cityMsg.textContent = "location is off for this page. search for your city instead."; }, { timeout: 8000, maximumAge: 6e5 });
  });

  /* widget sheet */
  $("#widgetBtn").addEventListener("click", () => {
    const days = state.city.days;
    const ti = Math.max(0, days.findIndex((d) => d.date === state.today));
    const d = days[ti] || days[0];
    const o = dressFor(d);
    const g = glowFor(o);
    const cat = crabSVG(o, { flat: true });
    $("#home").style.setProperty("--glow", g);
    $("#home").innerHTML = `
      <div class="w w-medium"><div class="wbox"><div class="wglow"></div><div class="wcat">${cat}</div><span class="wt l">${temp(d.min)}</span><span class="wt r">${temp(d.max)}</span></div><label>weathercrab</label></div>
      <div class="w w-small"><div class="wbox"><div class="wglow"></div><div class="wcat">${cat}</div><span class="wt l">${temp(d.min)}</span><span class="wt r">${temp(d.max)}</span></div><label>weathercrab</label></div>
      <div class="w-icons">
        <div class="w"><div class="app-icon">${crabSVG({ tier: "sweater", rain: false, snow: false, sunny: false }, { flat: true })}</div><label>weathercrab</label></div>
        <div class="w"><div class="app-icon ghost"></div><label>&nbsp;</label></div>
        <div class="w"><div class="app-icon ghost"></div><label>&nbsp;</label></div>
        <div class="w"><div class="app-icon ghost"></div><label>&nbsp;</label></div>
      </div>`;
    $("#widgetNote").textContent = `${dayName(d.date, state.today)} in ${state.city.name}: ${wearText(o)}`;
    showSheet($("#widgetSheet"));
  });

  /* ---------- live data (works when the page may reach open-meteo) ---------- */
  async function getJSON(url, ms, signal) {
    const ac = new AbortController();
    const t = setTimeout(() => ac.abort(), ms);
    signal?.addEventListener("abort", () => ac.abort());
    try {
      const r = await fetch(url, { signal: ac.signal });
      if (!r.ok) throw new Error("http " + r.status);
      return await r.json();
    } finally { clearTimeout(t); }
  }
  async function loadLive(c) {
    try {
      const r = await getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&daily=weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min,wind_speed_10m_max,precipitation_probability_max&hourly=weather_code&minutely_15=weather_code&past_minutely_15=1&forecast_minutely_15=32&past_days=1&forecast_days=7&timezone=auto&wind_speed_unit=ms`, 7000);
      const days = toDays(r.daily);
      if (!days.length) return null;
      return {
        ...c, tz: r.timezone || c.tz, days, _slots: null, off: r.utc_offset_seconds || 0,
        h0: r.hourly?.time?.[0], h: r.hourly?.weather_code, m0: r.minutely_15?.time?.[0], m: r.minutely_15?.weather_code
      };
    } catch (e) { return null; }
  }

  setInterval(() => { if (!document.hidden) renderRainLines(); }, 30000);
  setInterval(async () => {
    if (!state.live || document.hidden || openSheet) return;
    const live = await loadLive(state.city);
    if (!live) return;
    const date = state.city.days[state.idx]?.date;
    state.city = live;
    const i = Math.max(0, live.days.findIndex((d) => d.date === date));
    renderSlides(); jump(i); setDay(i);
  }, 15 * 6e4);

  /* ---------- boot ---------- */
  renderUnit();
  const want = saved.city;
  const nyc = snapCities.find((c) => c.g === "big" && c.name === "new york") || snapCities[0];
  const first = (want && snapCities.find((c) => c.full === want.full)) || nyc;
  setCity(first);
  (async () => {
    const target = want && want.lat != null ? want : first;
    const live = await loadLive(target);
    if (!live) { state.live = false; renderNote(); return; }
    state.live = true;
    setCity(live, true);
  })();
})();
</script>
